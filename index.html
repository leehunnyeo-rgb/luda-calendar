<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>루다의 캘린더</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 15px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

      color: #333;

      background:
        linear-gradient(
          135deg,
          #eee7ff 0%,
          #f8f5ff 45%,
          #f0ecff 100%
        );
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }


    /* =====================================================
       상단
    ===================================================== */

    .top-card {
      padding: 28px 30px;
      margin-bottom: 18px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #8d6bea,
          #6f55d9
        );

      border-radius: 24px;

      box-shadow:
        0 12px 30px rgba(105, 76, 190, 0.22);
    }

    .top-card h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 800;
    }

    .top-card p {
      margin: 8px 0 0;

      font-size: 14px;

      opacity: 0.9;
    }


    /* =====================================================
       로그인
    ===================================================== */

    .info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 13px 18px;
      margin-bottom: 18px;

      background: rgba(255,255,255,0.92);

      border-radius: 16px;

      box-shadow:
        0 5px 18px rgba(80,60,120,0.08);

      flex-wrap: wrap;
    }

    .login-status {
      font-size: 13px;
      color: #777;
    }

    .login-btn {
      padding: 9px 16px;

      border: 0;
      border-radius: 10px;

      background: #7659df;
      color: white;

      cursor: pointer;

      font-weight: 700;
    }

    .login-btn:hover {
      background: #6548ce;
    }


    /* =====================================================
       에러
    ===================================================== */

    .error-box {
      display: none;

      padding: 12px 15px;
      margin-bottom: 15px;

      background: #fff0f2;
      color: #c44961;

      border: 1px solid #ffd0d8;
      border-radius: 12px;

      font-size: 13px;
    }


    /* =====================================================
       캘린더
    ===================================================== */

    .calendar-card {
      overflow: hidden;

      padding: 22px;

      background: white;

      border-radius: 24px;

      box-shadow:
        0 12px 35px rgba(80,60,120,0.10);
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 18px;
    }

    .month-title {
      color: #4b3c73;

      font-size: 23px;
      font-weight: 800;
    }

    .calendar-buttons {
      display: flex;
      gap: 7px;
    }

    .calendar-buttons button {
      width: 38px;
      height: 36px;

      padding: 0;

      border: 0;
      border-radius: 10px;

      background: #f1edff;
      color: #6650a5;

      cursor: pointer;

      font-size: 16px;
      font-weight: 700;
    }

    .calendar-buttons button:hover {
      background: #e4dcff;
    }

    .calendar-buttons .today-btn {
      width: auto;

      padding: 0 13px;

      font-size: 13px;
    }


    /* =====================================================
       요일
    ===================================================== */

    .weekday-row {
      display: grid;

      grid-template-columns:
        repeat(7, 1fr);

      border-bottom: 1px solid #eee;
    }

    .weekday {
      padding: 10px 3px;

      text-align: center;

      color: #777;

      font-size: 13px;
      font-weight: 700;
    }

    .weekday.saturday {
      color: #6384d8;
    }

    .weekday.sunday {
      color: #e56b83;
    }


    /* =====================================================
       달력 그리드
    ===================================================== */

    .calendar-grid {
      display: grid;

      grid-template-columns:
        repeat(7, 1fr);

      border-left: 1px solid #eee;
      border-top: 1px solid #eee;

      user-select: none;
    }

    .calendar-grid.dragging {
      cursor: crosshair;
      user-select: none;
    }

    .empty-cell {
      min-height: 125px;

      background: #fafafa;

      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }


    /* =====================================================
       날짜 칸
    ===================================================== */

    .day {
      position: relative;

      min-height: 125px;

      padding: 8px;

      overflow: hidden;

      background: white;

      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;

      cursor: default;

      transition:
        background 0.12s ease,
        box-shadow 0.12s ease;
    }

    .day.admin-day {
      cursor: crosshair;
    }

    .day:hover {
      background: #faf8ff;
    }


    /* 오늘 */

    .day.today {
      box-shadow:
        inset 0 0 0 2px #8b6de8;
    }


    /* =====================================================
       날짜 숫자
    ===================================================== */

    .day-number {
      position: relative;

      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 28px;
      height: 28px;

      margin-bottom: 5px;

      border-radius: 50%;

      color: #555;

      font-size: 13px;
      font-weight: 700;
    }

    .day.saturday .day-number {
      color: #5f7fd0;
    }

    .day.sunday .day-number {
      color: #df6179;
    }

    .day.today .day-number {
      background: #7c60dc;
      color: white;
    }


    /* =====================================================
       ★ 일정 1개일 때만 날짜 칸 전체 색상
    ===================================================== */

    .day.single-colored-gray {
      background: #e7e7eb;
    }

    .day.single-colored-green {
      background: #d7f0dc;
    }

    .day.single-colored-yellow {
      background: #fff0b3;
    }

    .day.single-colored-purple {
      background: #e6dcff;
    }


    .day.single-colored-gray:hover {
      background: #dfdfe3;
    }

    .day.single-colored-green:hover {
      background: #cde9d3;
    }

    .day.single-colored-yellow:hover {
      background: #ffe9a1;
    }

    .day.single-colored-purple:hover {
      background: #ddd1f8;
    }


    /* =====================================================
       일정 영역
    ===================================================== */

    .events {
      position: relative;

      z-index: 4;

      display: flex;
      flex-direction: column;

      gap: 4px;
    }

    .event {
      display: block;

      padding: 4px 6px;

      border-radius: 6px;

      font-size: 12px;
      line-height: 1.35;

      font-weight: 600;

      word-break: break-word;
      white-space: pre-line;

      cursor: pointer;
    }


    /* =====================================================
       ★ 여러 일정 / 색상 없음
       → 글자 부분만 색칠
    ===================================================== */

    .event.no-color {
      background: #f3f1f7;

      color: #4e485c;

      border:
        1px solid #e2dfea;
    }


    /*
      색상 일정이지만
      여러 개가 있는 경우

      → 각각 글자 부분만 색칠
    */

    .event.multi-gray {
      background: rgba(120,120,130,0.20);

      color: #4e4e55;
    }

    .event.multi-green {
      background: rgba(72,160,94,0.20);

      color: #317340;
    }

    .event.multi-yellow {
      background: rgba(235,183,44,0.24);

      color: #866817;
    }

    .event.multi-purple {
      background: rgba(126,91,210,0.20);

      color: #6843a7;
    }


    /* =====================================================
       드래그 선택
    ===================================================== */

    .day.drag-selected {
      background: #dcd1ff !important;

      box-shadow:
        inset 0 0 0 2px #8567e5;
    }

    .day.drag-selected .day-number {
      background: #8062df;

      color: white;
    }

    .day.drag-anchor {
      box-shadow:
        inset 0 0 0 3px #6848d0;
    }


    /* =====================================================
       모달
    ===================================================== */

    .modal-bg {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 1000;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(30, 20, 50, 0.45);

      backdrop-filter: blur(3px);
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: min(440px, 100%);

      padding: 24px;

      background: white;

      border-radius: 20px;

      box-shadow:
        0 20px 60px rgba(40,25,70,0.25);
    }

    .modal h2 {
      margin: 0 0 18px;

      color: #4d3d72;

      font-size: 21px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      color: #625b6e;

      font-size: 13px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select {
      width: 100%;

      padding: 11px 12px;

      outline: none;

      border:
        1px solid #ddd7e7;

      border-radius: 10px;

      background: white;

      font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #8568dc;

      box-shadow:
        0 0 0 3px rgba(133,104,220,0.10);
    }

    .range-info {
      padding: 11px 13px;

      color: #644fa4;

      background: #f4f0ff;

      border:
        1px solid #e4dcff;

      border-radius: 11px;

      font-size: 13px;

      line-height: 1.5;
    }

    .range-info strong {
      color: #4e3a88;
    }

    .modal-buttons {
      display: flex;

      align-items: center;
      justify-content: flex-end;

      gap: 8px;

      margin-top: 20px;
    }

    .modal-buttons button {
      padding: 10px 16px;

      border: 0;
      border-radius: 10px;

      cursor: pointer;

      font-weight: 700;
    }

    .cancel-btn {
      background: #f1eff4;
      color: #68636f;
    }

    .save-btn {
      background: #7659df;
      color: white;
    }

    .delete-btn {
      margin-right: auto;

      background: #fff0f2;
      color: #d05268;
    }


    /* =====================================================
       모바일
    ===================================================== */

    @media (max-width: 700px) {

      body {
        padding: 15px 8px 35px;
      }

      .top-card {
        padding: 22px 20px;
        border-radius: 18px;
      }

      .top-card h1 {
        font-size: 23px;
      }

      .calendar-card {
        padding: 10px;
        border-radius: 18px;
      }

      .calendar-header {
        padding: 6px 4px;
      }

      .month-title {
        font-size: 18px;
      }

      .weekday {
        padding: 8px 1px;
        font-size: 11px;
      }

      .day,
      .empty-cell {
        min-height: 92px;
      }

      .day {
        padding: 5px;
      }

      .day-number {
        width: 23px;
        height: 23px;
        font-size: 11px;
      }

      .event {
        padding: 4px 5px;

        border-radius: 5px;

        font-size: 10px;
      }
    }

  </style>
</head>


<body>

<div class="container">


  <!-- =====================================================
       상단
  ====================================================== -->

  <div class="top-card">

    <h1>
      루다의 캘린더
    </h1>

    <p>
      일정을 한눈에 확인해보세요 ✨
    </p>

  </div>


  <!-- =====================================================
       로그인 상태
  ====================================================== -->

  <div class="info-bar">

    <div
      class="login-status"
      id="loginStatus"
    >
      공개 캘린더 · 누구나 일정 확인 가능
    </div>


    <button
      class="login-btn"
      id="loginButton"
      onclick="openLoginModal()"
    >
      관리자 로그인
    </button>

  </div>


  <!-- 에러 -->

  <div
    id="errorBox"
    class="error-box"
  ></div>


  <!-- =====================================================
       캘린더
  ====================================================== -->

  <div class="calendar-card">


    <div class="calendar-header">

      <div
        class="month-title"
        id="monthTitle"
      ></div>


      <div class="calendar-buttons">

        <button
          onclick="changeMonth(-1)"
        >
          ‹
        </button>


        <button
          class="today-btn"
          onclick="goToday()"
        >
          오늘
        </button>


        <button
          onclick="changeMonth(1)"
        >
          ›
        </button>

      </div>

    </div>


    <!-- 요일 -->

    <div class="weekday-row">

      <div class="weekday">
        월
      </div>

      <div class="weekday">
        화
      </div>

      <div class="weekday">
        수
      </div>

      <div class="weekday">
        목
      </div>

      <div class="weekday">
        금
      </div>

      <div class="weekday saturday">
        토
      </div>

      <div class="weekday sunday">
        일
      </div>

    </div>


    <!-- 날짜 -->

    <div
      class="calendar-grid"
      id="calendarGrid"
    ></div>


  </div>

</div>



<!-- =======================================================
     일정 추가 / 수정 모달
======================================================= -->

<div
  class="modal-bg"
  id="eventModalBg"
  onclick="closeModalByBackground(event)"
>

  <div class="modal">


    <h2 id="eventModalTitle">
      일정 추가
    </h2>


    <!-- 단일 날짜 -->

    <div
      class="form-group"
      id="singleDateGroup"
    >

      <label>
        날짜
      </label>

      <input
        type="date"
        id="dateInput"
      >

    </div>


    <!-- 여러 날짜 -->

    <div
      class="form-group"
      id="rangeDateGroup"
      style="display:none;"
    >

      <label>
        선택한 날짜
      </label>

      <div
        class="range-info"
        id="rangeInfo"
      ></div>

    </div>


    <!-- 일정 -->

    <div class="form-group">

      <label>
        일정
      </label>

      <input
        type="text"
        id="titleInput"
        placeholder="일정 내용을 입력하세요"
        autocomplete="off"
      >

    </div>


    <!-- 색상 -->

    <div class="form-group">

      <label>
        색상
      </label>

      <select id="colorInput">

        <option value="">
          색상 없음
        </option>

        <option value="gray">
          회색
        </option>

        <option value="green">
          초록색
        </option>

        <option value="yellow">
          노란색
        </option>

        <option value="purple">
          보라색
        </option>

      </select>

    </div>


    <!-- 버튼 -->

    <div class="modal-buttons">

      <button
        class="delete-btn"
        id="deleteButton"
        onclick="deleteEvent()"
        style="display:none;"
      >
        삭제
      </button>


      <button
        class="cancel-btn"
        onclick="closeEventModal()"
      >
        취소
      </button>


      <button
        class="save-btn"
        onclick="saveEvent()"
      >
        저장
      </button>

    </div>

  </div>

</div>



<!-- =======================================================
     로그인 모달
======================================================= -->

<div
  class="modal-bg"
  id="loginModalBg"
  onclick="closeLoginByBackground(event)"
>

  <div class="modal">


    <h2>
      관리자 로그인
    </h2>


    <div
      style="
        margin-bottom:15px;
        color:#777;
        font-size:13px;
        line-height:1.5;
      "
    >
      로그인하면 일정을 추가하거나
      수정하고 삭제할 수 있습니다.
    </div>


    <div class="form-group">

      <label>
        이메일
      </label>

      <input
        type="email"
        id="emailInput"
        placeholder="이메일"
        autocomplete="email"
      >

    </div>


    <div class="form-group">

      <label>
        비밀번호
      </label>

      <input
        type="password"
        id="passwordInput"
        placeholder="비밀번호"
        autocomplete="current-password"
      >

    </div>


    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeLoginModal()"
      >
        취소
      </button>


      <button
        class="save-btn"
        onclick="login()"
      >
        로그인
      </button>

    </div>

  </div>

</div>



<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://invachujoiisrbhkzhzc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1-PfSu1n9AE0PdTKTQExFA_tIsfTJmZ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   상태
========================================================= */

let currentDate =
  new Date();

let events =
  [];

let currentUser =
  null;

let editingEventId =
  null;


/* 드래그 상태 */

let isDragging =
  false;

let dragStartDate =
  null;

let dragCurrentDate =
  null;

let selectedDates =
  [];

let suppressNextClick =
  false;


/* =========================================================
   DOM
========================================================= */

const monthTitle =
  document.getElementById(
    "monthTitle"
  );

const calendarGrid =
  document.getElementById(
    "calendarGrid"
  );

const errorBox =
  document.getElementById(
    "errorBox"
  );

const loginStatus =
  document.getElementById(
    "loginStatus"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );


/* =========================================================
   공통
========================================================= */

function showError(
  message
) {

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";
}


function clearError() {

  errorBox.textContent =
    "";

  errorBox.style.display =
    "none";
}


/* =========================================================
   날짜
========================================================= */

function formatDate(
  date
) {

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    `${year}-${month}-${day}`
  );
}


function parseLocalDate(
  dateString
) {

  const parts =
    dateString
      .split("-")
      .map(Number);


  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );
}


function getEventsForDate(
  dateString
) {

  return events.filter(
    event =>
      event.date ===
      dateString
  );
}


/* =========================================================
   인증
========================================================= */

async function checkAuth() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    currentUser =
      session?.user ||
      null;


    updateAuthUI();

  } catch (error) {

    console.error(error);
  }
}


function updateAuthUI() {

  if (currentUser) {

    loginStatus.textContent =
      "관리자 로그인 상태 · 일정 추가/수정/삭제 가능";


    loginButton.textContent =
      "로그아웃";


    loginButton.onclick =
      logout;

  } else {

    loginStatus.textContent =
      "공개 캘린더 · 누구나 일정 확인 가능";


    loginButton.textContent =
      "관리자 로그인";


    loginButton.onclick =
      openLoginModal;
  }


  renderCalendar();
}


/* =========================================================
   로그인
========================================================= */

function openLoginModal() {

  document
    .getElementById(
      "loginModalBg"
    )
    .classList.add(
      "show"
    );


  setTimeout(
    () => {

      document
        .getElementById(
          "emailInput"
        )
        .focus();

    },
    100
  );
}


function closeLoginModal() {

  document
    .getElementById(
      "loginModalBg"
    )
    .classList.remove(
      "show"
    );
}


async function login() {

  clearError();


  const email =
    document
      .getElementById(
        "emailInput"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "passwordInput"
      )
      .value;


  if (
    !email ||
    !password
  ) {

    alert(
      "이메일과 비밀번호를 입력해주세요."
    );

    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {
      throw error;
    }


    currentUser =
      data.user;


    closeLoginModal();


    document
      .getElementById(
        "passwordInput"
      )
      .value =
      "";


    updateAuthUI();

  } catch (error) {

    console.error(error);


    alert(
      "로그인에 실패했습니다.\n" +
      error.message
    );
  }
}


async function logout() {

  try {

    await supabaseClient
      .auth
      .signOut();


    currentUser =
      null;


    updateAuthUI();

  } catch (error) {

    console.error(error);


    alert(
      "로그아웃 중 오류가 발생했습니다."
    );
  }
}


/* =========================================================
   일정 불러오기
========================================================= */

async function loadEvents() {

  clearError();


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("events")
        .select("*")
        .order("date", {
         ascending: true
        })
        .order("sort_order", {
          ascending: true
        });

    
    if (error) {
      throw error;
    }


    events =
      data || [];


    renderCalendar();

  } catch (error) {

    console.error(error);


    showError(
      "일정을 불러오지 못했습니다: " +
      error.message
    );
  }
}


/* =========================================================
   ★ 캘린더 렌더링
========================================================= */

function renderCalendar() {

  const year =
    currentDate.getFullYear();


  const month =
    currentDate.getMonth();


  monthTitle.textContent =
    `${year}년 ${month + 1}월`;


  calendarGrid.innerHTML =
    "";


  /*
    월요일 시작

    JS:
    일 0
    월 1
    화 2
    수 3
    목 4
    금 5
    토 6

    캘린더:
    월 0
    화 1
    수 2
    목 3
    금 4
    토 5
    일 6
  */

  const jsFirstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const firstDay =
    (
      jsFirstDay + 6
    ) % 7;


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  /*
    앞쪽 빈칸
  */

  for (
    let i = 0;
    i < firstDay;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty-cell";


    calendarGrid.appendChild(
      empty
    );
  }


  const today =
    new Date();


  const todayString =
    formatDate(
      today
    );


  /*
    날짜 생성
  */

  for (
    let dayNumber = 1;
    dayNumber <= daysInMonth;
    dayNumber++
  ) {

    const date =
      new Date(
        year,
        month,
        dayNumber
      );


    const dateString =
      formatDate(
        date
      );


    const day =
      document.createElement(
        "div"
      );


    day.className =
      "day";


    day.dataset.date =
      dateString;


    if (currentUser) {

      day.classList.add(
        "admin-day"
      );
    }


    /*
      토요일 / 일요일
    */

    const jsDay =
      date.getDay();


    if (
      jsDay === 6
    ) {

      day.classList.add(
        "saturday"
      );
    }


    if (
      jsDay === 0
    ) {

      day.classList.add(
        "sunday"
      );
    }


    /*
      오늘
    */

    if (
      dateString ===
      todayString
    ) {

      day.classList.add(
        "today"
      );
    }


    /*
      날짜 숫자
    */

    const number =
      document.createElement(
        "div"
      );


    number.className =
      "day-number";


    number.textContent =
      dayNumber;


    day.appendChild(
      number
    );


    /* =====================================================
       ★★★ 여기서 일정 개수를 판단
    ===================================================== */

    const dayEvents =
      getEventsForDate(
        dateString
      );


    const eventCount =
      dayEvents.length;


    /*
      ======================================================
      규칙

      ① 일정이 정확히 1개
         + 색상 있음
         → 날짜 칸 전체 색칠

      ② 일정이 2개 이상
         → 전부 글자 부분만 색칠

      ③ 일정이 1개
         + 색상 없음
         → 글자 부분만 표시
      ======================================================
    */


    if (
      eventCount === 1
    ) {

      const onlyEvent =
        dayEvents[0];


      const color =
        String(
          onlyEvent.color || ""
        ).toLowerCase();


      /*
        ★ 일정 1개이고
        색상이 있을 때만
        날짜 칸 전체를 칠한다.
      */

      if (
        [
          "gray",
          "green",
          "yellow",
          "purple"
        ].includes(
          color
        )
      ) {

        day.classList.add(
          `single-colored-${color}`
        );
      }
    }


    /*
      ======================================================
      일정 표시
    ======================================================
    */

    const eventsContainer =
      document.createElement(
        "div"
      );


    eventsContainer.className =
      "events";


    dayEvents.forEach(
      event => {

        const eventElement =
          document.createElement(
            "div"
          );


        eventElement.className =
          "event";


        const color =
          String(
            event.color || ""
          ).toLowerCase();


        /*
          ==================================================
          ★ 일정 1개 + 색상 있음

          날짜 전체가 이미 색칠됨.

          따라서 글자 부분에는
          별도의 색상 배경을 주지 않는다.
          ==================================================
        */

        if (
          eventCount === 1 &&
          color &&
          [
            "gray",
            "green",
            "yellow",
            "purple"
          ].includes(
            color
          )
        ) {

          eventElement.classList.add(
            "full-color-text"
          );

        }

        /*
          ==================================================
          ★ 일정 2개 이상 + 색상 있음

          날짜 전체는 칠하지 않고
          일정 글자 부분만 색칠.
          ==================================================
        */

        else if (
          eventCount >= 2 &&
          color &&
          [
            "gray",
            "green",
            "yellow",
            "purple"
          ].includes(
            color
          )
        ) {

          eventElement.classList.add(
            `multi-${color}`
          );
        }

        /*
          ==================================================
          색상 없음

          항상 글자 부분 표시
          ==================================================
        */

        else {

          eventElement.classList.add(
            "no-color"
          );
        }


        eventElement.textContent =
          event.title;


        /*
          일정 위에서 드래그 시작 방지
        */

        eventElement.addEventListener(
          "pointerdown",
          eventObject => {

            eventObject.stopPropagation();
          }
        );


        /*
          일정 클릭 → 수정
        */

        eventElement.addEventListener(
          "click",
          eventObject => {

            eventObject.stopPropagation();


            if (!currentUser) {
              return;
            }


            openEditModal(
              event
            );
          }
        );


        eventsContainer.appendChild(
          eventElement
        );
      }
    );


    day.appendChild(
      eventsContainer
    );


    /*
      ======================================================
      날짜 클릭
      ======================================================
    */

    day.addEventListener(
      "click",
      () => {

        if (
          suppressNextClick
        ) {

          suppressNextClick =
            false;

          return;
        }


        if (!currentUser) {
          return;
        }


        const dayEventsNow =
          getEventsForDate(
            dateString
          );


        if (
          dayEventsNow.length > 0
        ) {

          /*
            여러 개면 첫 번째 일정 수정.
          */

          openEditModal(
            dayEventsNow[0]
          );

        } else {

          openAddModal(
            dateString
          );
        }
      }
    );


    calendarGrid.appendChild(
      day
    );
  }


  /*
    뒤쪽 빈칸
  */

  const totalCells =
    firstDay +
    daysInMonth;


  const remaining =
    (
      7 -
      (
        totalCells % 7
      )
    ) % 7;


  for (
    let i = 0;
    i < remaining;
    i++
  ) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty-cell";


    calendarGrid.appendChild(
      empty
    );
  }
}

/* =========================================================
   날짜 범위
========================================================= */

function getDateRange(
  startString,
  endString
) {

  let start =
    parseLocalDate(
      startString
    );


  let end =
    parseLocalDate(
      endString
    );


  if (
    start > end
  ) {

    const temp =
      start;


    start =
      end;


    end =
      temp;
  }


  const result =
    [];


  const cursor =
    new Date(start);


  while (
    cursor <= end
  ) {

    result.push(
      formatDate(
        cursor
      )
    );


    cursor.setDate(
      cursor.getDate() + 1
    );
  }


  return result;
}


/* =========================================================
   드래그
========================================================= */

function updateDragSelection() {

  if (
    !dragStartDate ||
    !dragCurrentDate
  ) {

    return;
  }


  selectedDates =
    getDateRange(
      dragStartDate,
      dragCurrentDate
    );


  document
    .querySelectorAll(
      ".day[data-date]"
    )
    .forEach(
      day => {

        const date =
          day.dataset.date;


        day.classList.toggle(
          "drag-selected",
          selectedDates.includes(
            date
          )
        );


        day.classList.toggle(
          "drag-anchor",
          date ===
          dragStartDate
        );
      }
    );
}


function clearDragSelection() {

  document
    .querySelectorAll(
      ".day.drag-selected, .day.drag-anchor"
    )
    .forEach(
      day => {

        day.classList.remove(
          "drag-selected",
          "drag-anchor"
        );
      }
    );


  selectedDates =
    [];


  dragStartDate =
    null;


  dragCurrentDate =
    null;
}


function startDrag(
  dateString
) {

  if (!currentUser) {
    return;
  }


  isDragging =
    true;


  dragStartDate =
    dateString;


  dragCurrentDate =
    dateString;


  selectedDates =
    [
      dateString
    ];


  calendarGrid.classList.add(
    "dragging"
  );


  updateDragSelection();
}


function updateDragFromPointer(
  clientX,
  clientY
) {

  if (!isDragging) {
    return;
  }


  const element =
    document.elementFromPoint(
      clientX,
      clientY
    );


  if (!element) {
    return;
  }


  const day =
    element.closest(
      ".day[data-date]"
    );


  if (!day) {
    return;
  }


  const dateString =
    day.dataset.date;


  if (
    dateString !==
    dragCurrentDate
  ) {

    dragCurrentDate =
      dateString;


    updateDragSelection();
  }
}


function finishDrag() {

  if (!isDragging) {
    return;
  }


  isDragging =
    false;


  calendarGrid.classList.remove(
    "dragging"
  );


  const dates =
    [
      ...selectedDates
    ];


  suppressNextClick =
    true;


  setTimeout(
    () => {

      suppressNextClick =
        false;

    },
    300
  );


  if (
    dates.length === 0
  ) {

    clearDragSelection();

    return;
  }


  /*
    한 날짜
  */

  if (
    dates.length === 1
  ) {

    const date =
      dates[0];


    clearDragSelection();


    openAddModal(
      date
    );


    return;
  }


  /*
    여러 날짜
  */

  selectedDates =
    dates;


  openMultiAddModal(
    dates
  );
}


/* =========================================================
   드래그 시작
========================================================= */

calendarGrid.addEventListener(
  "pointerdown",
  event => {

    if (!currentUser) {
      return;
    }


    /*
      일정 자체를 누르면
      수정으로 처리.
    */

    if (
      event.target.closest(
        ".event"
      )
    ) {

      return;
    }


    const day =
      event.target.closest(
        ".day[data-date]"
      );


    if (!day) {
      return;
    }


    event.preventDefault();


    startDrag(
      day.dataset.date
    );
  }
);


/* =========================================================
   드래그 이동
========================================================= */

document.addEventListener(
  "pointermove",
  event => {

    if (!isDragging) {
      return;
    }


    event.preventDefault();


    updateDragFromPointer(
      event.clientX,
      event.clientY
    );
  },
  {
    passive: false
  }
);


/* =========================================================
   드래그 종료
========================================================= */

document.addEventListener(
  "pointerup",
  () => {

    if (isDragging) {

      finishDrag();
    }
  }
);

/* =========================================================
   일정 저장
========================================================= */

async function saveEvent() {

  if (!currentUser) {

    alert(
      "일정을 추가하려면 먼저 로그인해주세요."
    );

    return;
  }


  clearError();


  const title =
    document
      .getElementById(
        "titleInput"
      )
      .value
      .trim();


  const color =
    document
      .getElementById(
        "colorInput"
      )
      .value;


  if (!title) {

    alert(
      "일정 내용을 입력해주세요."
    );


    document
      .getElementById(
        "titleInput"
      )
      .focus();


    return;
  }


  /* =====================================================
     수정
  ===================================================== */

  if (editingEventId) {

    const date =
      document
        .getElementById(
          "dateInput"
        )
        .value;


    if (!date) {

      alert(
        "날짜를 선택해주세요."
      );

      return;
    }


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("events")
          .update({

            date:
              date,

            title:
              title,

            color:
              color

          })
          .eq(
            "id",
            editingEventId
          )
          .select();


      if (error) {
        throw error;
      }


      const index =
        events.findIndex(
          event =>
            event.id ===
            editingEventId
        );


      if (
        index !== -1 &&
        data &&
        data.length > 0
      ) {

        events[index] =
          data[0];
      }


      closeEventModal();


      renderCalendar();


      return;

    } catch (error) {

      console.error(error);


      alert(
        "일정 수정에 실패했습니다.\n" +
        error.message
      );


      return;
    }
  }


  /* =====================================================
     새 일정
  ===================================================== */

  let datesToSave =
    [
      ...selectedDates
    ];


  if (
    datesToSave.length === 0
  ) {

    const date =
      document
        .getElementById(
          "dateInput"
        )
        .value;


    if (!date) {

      alert(
        "날짜를 선택해주세요."
      );


      return;
    }


    datesToSave =
      [
        date
      ];
  }


  /*
    중복 날짜 제거
  */

  datesToSave =
    [
      ...new Set(
        datesToSave
      )
    ];


  /*
    여러 날짜에 동일 일정 저장
  */

  const rows =
  datesToSave.map(
    (date, index) => ({
      id: crypto.randomUUID(),
      date: date,
      title: title,
      color: color,
      sort_order: index
    })
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("events")
        .insert(
          rows
        )
        .select();


    if (error) {
      throw error;
    }


    if (data) {

      events.push(
        ...data
      );
    }


    closeEventModal();


    renderCalendar();

  } catch (error) {

    console.error(error);


    alert(
      "일정 저장에 실패했습니다.\n" +
      error.message
    );
  }
}


/* =========================================================
   일정 삭제
========================================================= */

async function deleteEvent() {

  if (!currentUser) {
    return;
  }


  if (!editingEventId) {
    return;
  }


  const event =
    events.find(
      item =>
        item.id ===
        editingEventId
    );


  if (!event) {
    return;
  }


  const confirmed =
    confirm(
      `"${event.title}" 일정을 삭제할까요?`
    );


  if (!confirmed) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("events")
        .delete()
        .eq(
          "id",
          editingEventId
        );


    if (error) {
      throw error;
    }


    events =
      events.filter(
        item =>
          item.id !==
          editingEventId
      );


    closeEventModal();


    renderCalendar();

  } catch (error) {

    console.error(error);


    alert(
      "일정 삭제에 실패했습니다.\n" +
      error.message
    );
  }
}

      if (
        active.id ===
        "titleInput"
      ) {

        event.preventDefault();


        saveEvent();
      }
    }


    /*
      로그인 Enter
    */

    if (
      event.key === "Enter" &&
      document
        .getElementById(
          "loginModalBg"
        )
        .classList.contains(
          "show"
        )
    ) {

      const active =
        document.activeElement;


      if (
        active.id === "emailInput" ||
        active.id === "passwordInput"
      ) {

        event.preventDefault();


        login();
      }
    }


    /*
      ESC
    */

    if (
      event.key ===
      "Escape"
    ) {

      if (
        document
          .getElementById(
            "eventModalBg"
          )
          .classList.contains(
            "show"
          )
      ) {

        closeEventModal();
      }


      if (
        document
          .getElementById(
            "loginModalBg"
          )
          .classList.contains(
            "show"
          )
      ) {

        closeLoginModal();
      }
    }
  }
);


/* =========================================================
   인증 상태 변화
========================================================= */

supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    currentUser =
      session?.user ||
      null;


    updateAuthUI();
  }
);


/* =========================================================
   초기화
========================================================= */

async function init() {

  await checkAuth();

  await loadEvents();
}


init();

</script>
