<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>루다의 일정표</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --purple: #7c5ce6;
  --purple-dark: #6848d3;
  --purple-deep: #5b3fc1;
  --purple-light: #f1edff;
  --purple-soft: #f7f4ff;

  --bg: #f6f3fc;
  --text: #29233a;
  --muted: #918aa3;
  --border: #e8e3f0;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Noto Sans KR",
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

/* =========================
   전체
========================= */

.wrap {
  max-width: 1500px;
  margin: 0 auto;
  padding: 28px;
}

/* =========================
   상단
========================= */

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mark {
  width: 46px;
  height: 46px;
  border-radius: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  font-size: 21px;
  font-weight: 800;

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-deep)
  );

  box-shadow:
    0 8px 20px rgba(124, 92, 230, 0.25);
}

.brand h1 {
  margin: 0;
  font-size: 23px;
  font-weight: 800;
}

.brand p {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--muted);
}

.top-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.top-btn {
  border: 1px solid var(--purple-border, #ddd4fa);
  background: white;
  color: var(--purple-deep);

  padding: 10px 15px;
  border-radius: 11px;

  font-weight: 700;
  font-size: 13px;

  transition: 0.15s;
}

.top-btn:hover {
  background: var(--purple-light);
  transform: translateY(-1px);
}

.top-btn.primary {
  color: white;
  border-color: var(--purple);

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-deep)
  );

  box-shadow:
    0 5px 14px rgba(124, 92, 230, 0.22);
}

/* =========================
   레이아웃
========================= */

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 20px;
}

.calendar-card,
.side {
  background: white;
  border: 1px solid var(--border);
  border-radius: 20px;

  box-shadow:
    0 8px 30px rgba(65, 42, 115, 0.06);
}

/* =========================
   달력 상단
========================= */

.calendar-card {
  overflow: hidden;
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 20px 22px;

  border-bottom: 1px solid var(--border);
}

.month-title {
  font-size: 21px;
  font-weight: 800;
}

.month-nav {
  display: flex;
  gap: 7px;
}

.month-btn {
  width: 36px;
  height: 36px;

  border: 1px solid var(--border);
  border-radius: 10px;

  background: white;
  color: var(--text);

  font-size: 18px;
  font-weight: 700;
}

.month-btn:hover {
  background: var(--purple-light);
  color: var(--purple-deep);
  border-color: #d8cff5;
}

/* =========================
   요일
========================= */

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);

  border-bottom: 1px solid var(--border);
}

.weekday {
  text-align: center;
  padding: 12px 4px;

  font-size: 12px;
  font-weight: 800;

  color: var(--muted);
}

.weekday.sun {
  color: #d06b78;
}

.weekday.sat {
  color: #6680b5;
}

/* =========================
   달력
========================= */

.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.day {
  position: relative;

  min-height: 135px;

  padding: 9px;

  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);

  background: white;

  transition:
    background 0.15s,
    transform 0.15s;
}

.day:nth-child(7n) {
  border-right: 0;
}

.day:hover {
  background: #faf8ff;
}

.day.muted {
  background: #fafafa;
  color: #c5c0cc;
}

.date {
  width: 28px;
  height: 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 5px;

  border-radius: 9px;

  font-size: 13px;
  font-weight: 800;

  color: var(--text);
}

.day.sun .date {
  color: #d06b78;
}

.day.sat .date {
  color: #6680b5;
}

/* 오늘 */

.day.today .date {
  color: white;

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-deep)
  );

  box-shadow:
    0 4px 10px rgba(124, 92, 230, 0.25);
}

/* =========================
   일정
========================= */

.events {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.event {
  position: relative;

  padding: 7px 9px;

  border-radius: 8px;

  font-size: 12px;
  font-weight: 700;
  line-height: 1.35;

  white-space: pre-wrap;
  word-break: break-word;

  cursor: grab;

  user-select: none;

  transition:
    transform 0.12s,
    box-shadow 0.12s,
    opacity 0.12s;
}

.event:active {
  cursor: grabbing;
}

.event.dragging {
  opacity: 0.35;
}

.event.drag-over {
  box-shadow: 0 -3px 0 var(--purple);
}

/* 일정 색상 */

.event.gray {
  background: #e3e3e3;
  color: #444;
}

.event.green {
  background: #dcebd5;
  color: #355a31;
}

.event.yellow {
  background: #fff0c5;
  color: #66521b;
}

.event.pink {
  background: #f5dce1;
  color: #693c46;
}

.event.blue {
  background: #dbe7f8;
  color: #355278;
}

.event.purple {
  background: #e7ddf5;
  color: #5b4376;
}

/* =========================
   ⭐ 일정이 하나일 때
   날짜 칸 전체 색칠
========================= */

.day.single-gray {
  background: #e7e3eb;
}

.day.single-green {
  background: #dcebd5;
}

.day.single-yellow {
  background: #fff0c5;
}

.day.single-pink {
  background: #f5dce1;
}

.day.single-blue {
  background: #dbe7f8;
}

.day.single-purple {
  background: #e7ddf5;
}

/* 날짜 숫자도 전체 색상에 맞게 */

.day.single-gray .date,
.day.single-green .date,
.day.single-yellow .date,
.day.single-pink .date,
.day.single-blue .date,
.day.single-purple .date {
  color: inherit;
}

/* 하나일 때 일정 자체는 투명 */

.day.single-gray .event,
.day.single-green .event,
.day.single-yellow .event,
.day.single-pink .event,
.day.single-blue .event,
.day.single-purple .event {
  background: transparent;
}

/* 하나일 때 글자색 */

.day.single-gray .event {
  color: #514a59;
}

.day.single-green .event {
  color: #355a31;
}

.day.single-yellow .event {
  color: #66521b;
}

.day.single-pink .event {
  color: #693c46;
}

.day.single-blue .event {
  color: #355278;
}

.day.single-purple .event {
  color: #5b4376;
}

/* 오늘 + 전체 칸 색칠 */

.day.single-gray.today .date,
.day.single-green.today .date,
.day.single-yellow.today .date,
.day.single-pink.today .date,
.day.single-blue.today .date,
.day.single-purple.today .date {
  background: rgba(255,255,255,0.65);
  color: inherit;
}

/* =========================
   사이드
========================= */

.side {
  padding: 20px;
}

.side-title {
  margin-bottom: 16px;
}

.side-title small {
  display: block;

  margin-bottom: 4px;

  color: var(--muted);

  font-size: 12px;
  font-weight: 700;
}

.side-title strong {
  font-size: 20px;
}

.side-add {
  width: 100%;

  padding: 12px;

  border: 0;
  border-radius: 11px;

  background: var(--purple-light);
  color: var(--purple-deep);

  font-weight: 800;
}

.side-add:hover {
  background: #e8e0ff;
}

.side-events {
  margin-top: 18px;

  display: flex;
  flex-direction: column;
  gap: 8px;
}

.side-event {
  padding: 11px 12px;

  border-radius: 11px;

  font-size: 13px;
  font-weight: 700;

  white-space: pre-wrap;
  word-break: break-word;
}

.side-empty {
  padding: 20px 5px;

  text-align: center;

  color: var(--muted);

  font-size: 13px;
}

/* =========================
   모달
========================= */

.modal-backdrop {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(40, 30, 65, 0.35);

  z-index: 1000;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(460px, 100%);

  padding: 24px;

  border-radius: 20px;

  background: white;

  box-shadow:
    0 20px 70px rgba(43, 28, 83, 0.22);
}

.modal h2 {
  margin: 0 0 20px;

  font-size: 20px;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;

  margin-bottom: 7px;

  font-size: 12px;
  font-weight: 800;

  color: #625b72;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;

  border: 1px solid var(--border);
  border-radius: 10px;

  padding: 11px 12px;

  outline: none;

  background: white;
  color: var(--text);
}

.form-group textarea {
  min-height: 110px;
  resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: var(--purple);

  box-shadow:
    0 0 0 3px rgba(124, 92, 230, 0.1);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;

  margin-top: 20px;
}

.modal-btn {
  padding: 10px 15px;

  border-radius: 10px;

  font-weight: 800;

  border: 1px solid var(--border);

  background: white;
}

.modal-btn.cancel:hover {
  background: #f7f5fa;
}

.modal-btn.save {
  color: white;

  border-color: var(--purple);

  background: linear-gradient(
    135deg,
    var(--purple),
    var(--purple-deep)
  );
}

/* =========================
   로그인
========================= */

.login-info {
  margin: -10px 0 18px;

  color: var(--muted);

  font-size: 12px;
  line-height: 1.5;
}

/* =========================
   반응형
========================= */

@media (max-width: 1000px) {

  .layout {
    grid-template-columns: 1fr;
  }

  .side {
    order: 2;
  }

}

@media (max-width: 700px) {

  .wrap {
    padding: 12px;
  }

  .top {
    align-items: flex-start;
    flex-direction: column;
  }

  .calendar-head {
    padding: 15px;
  }

  .day {
    min-height: 105px;
    padding: 6px;
  }

  .event {
    padding: 6px;
    font-size: 11px;
  }

  .weekday {
    font-size: 10px;
    padding: 9px 2px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- =========================
       상단
  ========================= -->

  <div class="top">

    <div class="brand">

      <div class="mark">L</div>

      <div>
        <h1>루다의 일정표</h1>
        <p>함께 보는 일정 캘린더</p>
      </div>

    </div>

    <div class="top-actions">

      <button
        class="top-btn"
        id="loginBtn"
        onclick="openLoginModal()"
      >
        관리자 로그인
      </button>

      <button
        class="top-btn"
        id="logoutBtn"

      >

      </button>

      <button
        class="top-btn"
        onclick="goToday()"

        오늘
      </button>

      <button
        class="top-btn primary"
        onclick="openAddModal()"
      >
        ＋ 일정
      </button>

    </div>

  </div>


  <!-- =========================
       메인
  ========================= -->

  <div class="layout">

    <!-- 달력 -->

    <div class="calendar-card">

        <div
          class="month-title"
          id="monthTitle"
        ></div>

        <div class="month-nav">

          <button
            class="month-btn"
            onclick="changeMonth(-1)"

          </button>

          <button
            class="month-btn"
            onclick="changeMonth(1)"
          >
            ›
          </button>

        </div>

      </div>


      <div class="weekdays">

        <div class="weekday sun">일</div>
        <div class="weekday">월</div>
        <div class="weekday">화</div>
        <div class="weekday">수</div>
        <div class="weekday">목</div>
        <div class="weekday">금</div>
        <div class="weekday sat">토</div>

      <div
        class="calendar"
        id="calendar"
      ></div>

    <!-- 사이드 -->

      ></div>

</div>


<!-- =========================
     일정 모달
========================= -->

<div
  class="modal-backdrop"
  id="eventModal"
>

  <div class="modal">

    <h2 id="eventModalTitle">
      일정 추가
    </h2>


    <div class="form-group">

      <label>날짜</label>

      <input
        type="date"
        id="eventDate"
      >

    </div>


    <div class="form-group">

      <label>일정</label>

      <textarea
        id="eventText"
        placeholder="일정을 입력하세요."
      ></textarea>

    </div>


    <div class="form-group">

      <label>색상</label>

      <select id="eventColor">

        <option value="gray">
          회색
        </option>

        <option value="green">
          초록
        </option>

        <option value="yellow">
          노랑
        </option>

        <option value="pink">
          분홍
        </option>

        <option value="blue">
          파랑
        </option>

        <option value="purple">
          보라
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="modal-btn cancel"
        onclick="closeEventModal()"
      >
        취소
      </button>

      <button
        class="modal-btn save"
        onclick="saveEvent()"
      >

      </button>

    </div>

  </div>

</div>


<!-- =========================
     로그인 모달
========================= -->

<div
  class="modal-backdrop"
  id="loginModal"
>

  <div class="modal">

    <h2>관리자 로그인</h2>

    <div class="login-info">
      관리자 계정으로 로그인하면 일정을 추가, 수정, 삭제할 수 있습니다.
    </div>


    <div class="form-group">

      <label>이메일</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="이메일"
      >

    </div>


    <div class="form-group">

      <label>비밀번호</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="비밀번호"
      >

    </div>


    <div class="modal-actions">

      <button
        class="modal-btn cancel"
        onclick="closeLoginModal()"
      >
        취소
      </button>

      <button
        class="modal-btn save"
        onclick="login()"
      >
        로그인
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://invachujoiisrbhkzhzc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1-PfSu1n9AE0PdTKTQExFA_tIsfTJmZ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   상태
========================================================= */

let events = [];

let currentDate =
  new Date(2026, 9, 1);

let selectedDate =
  new Date(2026, 9, 1);

let editingId = null;

let draggedEventId = null;


/* =========================================================
   유틸
========================================================= */

function dateKey(date) {

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const d =
    String(date.getDate())
      .padStart(2, "0");

  return `${y}-${m}-${d}`;

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatText(value) {

  return escapeHtml(value)
    .replace(/\n/g, "<br>");

}


/* =========================================================
   인증
========================================================= */

async function checkAuth() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();

  updateAuthUI(
    !!session
  );

}


function updateAuthUI(loggedIn) {

  document.getElementById("loginBtn")
    .style.display =
      loggedIn ? "none" : "block";

  document.getElementById("logoutBtn")
    .style.display =
      loggedIn ? "block" : "none";

}


async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if (!email || !password) {

    alert("이메일과 비밀번호를 입력해주세요.");

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .auth
      .signInWithPassword({
        email,
        password
      });


  if (error) {

    alert(
      "로그인 실패: " +
      error.message
    );

    return;

  }


  closeLoginModal();

  updateAuthUI(true);

  render();

}


async function logout() {

  await supabaseClient
    .auth
    .signOut();

  updateAuthUI(false);

  render();

}


supabaseClient
  .auth
  .onAuthStateChange(
    (_event, session) => {

      updateAuthUI(
        !!session
      );

    }
  );


/* =========================================================
   데이터 불러오기
========================================================= */

async function loadEvents() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("events")
      .select("*")
      .order("date", {
        ascending: true
      })
      .order("sort_order", {
        ascending: true
      });


  if (error) {

    console.error(error);

    alert(
      "일정을 불러오지 못했습니다."
    );

    return;

  }


  events =
    data || [];


  normalizeLocalOrder();

  render();

}


/* =========================================================
   기존 데이터의 같은 날짜 순서 정리
========================================================= */

function normalizeLocalOrder() {

  const groups = {};


  events.forEach(event => {

    if (!groups[event.date]) {

      groups[event.date] = [];

    }

    groups[event.date].push(event);

  });


  Object.values(groups)
    .forEach(group => {

      group.sort(
        (a, b) =>
          Number(a.sort_order ?? 0) -
          Number(b.sort_order ?? 0)
      );


      group.forEach(
        (event, index) => {

          event.sort_order =
            index;

        }
      );

    });

}


/* =========================================================
   달력 렌더링
========================================================= */

function render() {

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();


  document.getElementById("monthTitle")
    .textContent =
      `${year}년 ${month + 1}월`;


  const calendar =
    document.getElementById("calendar");


  calendar.innerHTML = "";


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const daysInPrevMonth =
    new Date(
      year,
      month,
      0
    ).getDate();


  const todayKey =
    dateKey(new Date());


  /* 이전 달 */

  for (
    let i = firstDay - 1;
    i >= 0;
    i--
  ) {

    const number =
      daysInPrevMonth - i;

    const date =
      new Date(
        year,
        month - 1,
        number
      );

    createDay(
      calendar,
      date,
      true
    );

  }


  /* 현재 달 */

  for (
    let number = 1;
    number <= daysInMonth;
    number++
  ) {

    const date =
      new Date(
        year,
        month,
        number
      );

    createDay(
      calendar,
      date,
      false
    );

  }


  /* 다음 달 */

  const totalCells =
    firstDay + daysInMonth;

  const remaining =
    (7 - (totalCells % 7)) % 7;


  for (
    let number = 1;
    number <= remaining;
    number++
  ) {

    const date =
      new Date(
        year,
        month + 1,
        number
      );

    createDay(
      calendar,
      date,
      true
    );

  }


  renderSide();

}


function createDay(
  calendar,
  date,
  muted
) {

  const key =
    dateKey(date);

  const weekday =
    date.getDay();


  const day =
    document.createElement("div");


  let classes =
    "day";


  if (muted) {

    classes +=
      " muted";

  }


  if (weekday === 0) {

    classes +=
      " sun";

  }


  if (weekday === 6) {

    classes +=
      " sat";

  }


  if (key === dateKey(new Date())) {

    classes +=
      " today";

  }


  const dayEvents =
    events
      .filter(
        event =>
          event.date === key
      )
      .sort(
        (a, b) =>
          Number(a.sort_order ?? 0) -
          Number(b.sort_order ?? 0)
      );


  /*
    ⭐ 핵심 기능

    일정이 딱 1개일 경우
    날짜 칸 전체에 일정 색상을 적용한다.
  */

  if (dayEvents.length === 1) {

    const allowedColors = [
      "gray",
      "green",
      "yellow",
      "pink",
      "blue",
      "purple"
    ];


    const singleColor =
      allowedColors.includes(
        dayEvents[0].color
      )
        ? dayEvents[0].color
        : "gray";


    classes +=
      ` single-event single-${singleColor}`;

  }


  day.className =
    classes;


  /* 날짜 클릭 */

  day.onclick = () => {

    selectedDate =
      new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );


    renderSide();


    /*
      지난 달 / 다음 달 날짜를 클릭하면
      해당 월로 이동
    */

    if (muted) {

      currentDate =
        new Date(
          date.getFullYear(),
          date.getMonth(),
          1
        );

      render();

      return;

    }


    if (
      isLoggedIn() &&
      dayEvents.length === 0
    ) {

      openAddModal(key);

    }

  };


  /* 날짜 */

  const dateEl =
    document.createElement("div");

  dateEl.className =
    "date";

  dateEl.textContent =
    date.getDate();


  day.appendChild(dateEl);


  /* 일정 */

  const eventsEl =
    document.createElement("div");

  eventsEl.className =
    "events";


  dayEvents.forEach(
    event => {

      const eventEl =
        document.createElement("div");


      eventEl.className =
        `event ${event.color || "gray"}`;


      eventEl.draggable =
        isLoggedIn();


      eventEl.dataset.id =
        event.id;


      eventEl.innerHTML =
        formatText(event.text);


      /*
        일정 클릭

        관리자:
        확인 → 수정
        취소 → 삭제
      */

      eventEl.onclick =
        async clickEvent => {

          clickEvent.stopPropagation();


          if (!isLoggedIn()) {

            return;

          }


          const shouldEdit =
            confirm(
              "확인 = 수정\n취소 = 삭제"
            );


          if (shouldEdit) {

            openEditModal(event);

          } else {

            await deleteEvent(
              event.id
            );

          }

        };


      eventsEl.appendChild(
        eventEl
      );

    }
  );


  day.appendChild(
    eventsEl
  );


  calendar.appendChild(
    day
  );

}


function isLoggedIn() {

  return !!window.__session;

}


/* =========================================================
   드래그 앤 드롭
========================================================= */

function setupDragAndDrop() {

  const calendar =
    document.getElementById(
      "calendar"
    );


  calendar.addEventListener(
    "dragstart",
    dragStart
  );


  calendar.addEventListener(
    "dragend",
    dragEnd
  );


  calendar.addEventListener(
    "dragover",
    dragOver
  );


  calendar.addEventListener(
    "dragenter",
    dragEnter
  );


  calendar.addEventListener(
    "dragleave",
    dragLeave
  );


  calendar.addEventListener(
    "drop",
    dropEvent
  );

}


function dragStart(event) {

  const target =
    event.target.closest(
      ".event"
    );


  if (!target) {

    return;

  }


  draggedEventId =
    target.dataset.id;


  target.classList.add(
    "dragging"
  );


  event.dataTransfer.effectAllowed =
    "move";

}


function dragEnd(event) {

  const target =
    event.target.closest(
      ".event"
    );


  if (target) {

    target.classList.remove(
      "dragging"
    );

  }


  document
    .querySelectorAll(
      ".event.drag-over"
    )
    .forEach(
      el =>
        el.classList.remove(
          "drag-over"
        )
    );


  draggedEventId =
    null;

}


function dragOver(event) {

  if (!draggedEventId) {

    return;

  }


  event.preventDefault();

  event.dataTransfer.dropEffect =
    "move";

}


function dragEnter(event) {

  const target =
    event.target.closest(
      ".event"
    );


  if (!target) {

    return;

  }


  if (
    target.dataset.id ===
    String(draggedEventId)
  ) {

    return;

  }


  target.classList.add(
    "drag-over"
  );

}


function dragLeave(event) {

  const target =
    event.target.closest(
      ".event"
    );


  if (target) {

    target.classList.remove(
      "drag-over"
    );

  }

}


async function dropEvent(event) {

  event.preventDefault();


  const target =
    event.target.closest(
      ".event"
    );


  if (!target) {

    return;

  }


  const targetId =
    target.dataset.id;


  if (
    !draggedEventId ||
    targetId ===
      String(draggedEventId)
  ) {

    return;

  }


  const moved =
    events.find(
      event =>
        String(event.id) ===
        String(draggedEventId)
    );


  const targetEvent =
    events.find(
      event =>
        String(event.id) ===
        String(targetId)
    );


  if (!moved || !targetEvent) {

    return;

  }


  /*
    같은 날짜에서만 순서 변경
  */

  if (
    moved.date !==
    targetEvent.date
  ) {

    alert(
      "일정 순서 변경은 같은 날짜 안에서만 가능합니다."
    );

    return;

  }


  const sameDay =
    events
      .filter(
        event =>
          event.date ===
          moved.date
      )
      .sort(
        (a, b) =>
          Number(a.sort_order ?? 0) -
          Number(b.sort_order ?? 0)
      );


  /*
    기존 위치에서 제거
  */

  const oldIndex =
    sameDay.findIndex(
      event =>
        String(event.id) ===
        String(moved.id)
    );


  if (oldIndex !== -1) {

    sameDay.splice(
      oldIndex,
      1
    );

  }


  /*
    마우스가 대상 일정의
    위쪽인지 아래쪽인지 판단
  */

  const rect =
    target.getBoundingClientRect();

  const mouseY =
    event.clientY;

  const targetMiddle =
    rect.top +
    rect.height / 2;


  const currentTargetIndex =
    sameDay.findIndex(
      event =>
        String(event.id) ===
        String(targetId)
    );


  let insertIndex;


  if (
    mouseY <
    targetMiddle
  ) {

    insertIndex =
      currentTargetIndex;

  } else {

    insertIndex =
      currentTargetIndex + 1;

  }


  sameDay.splice(
    insertIndex,
    0,
    moved
  );


  /*
    순서 번호 다시 부여
  */

  sameDay.forEach(
    (event, index) => {

      event.sort_order =
        index;

    }
  );


  /*
    화면 먼저 갱신
  */

  render();


  /*
    Supabase 저장
  */

  for (
    const eventItem of sameDay
  ) {

    const {
      error
    } =
      await supabaseClient
        .from("events")
        .update({
          sort_order:
            eventItem.sort_order
        })
        .eq(
          "id",
          eventItem.id
        );


    if (error) {

      console.error(
        "순서 저장 실패:",
        error
      );

    }

  }

}


/* =========================================================
   로그인 모달
========================================================= */

function openLoginModal() {

  document
    .getElementById("loginModal")
    .classList.add("show");

}


function closeLoginModal() {

  document
    .getElementById("loginModal")
    .classList.remove("show");

}


/* =========================================================
   일정 모달
========================================================= */

function openAddModal(
  date = null
) {

  if (!isLoggedIn()) {

    openLoginModal();

    return;

  }


  editingId =
    null;


  document
    .getElementById("eventModalTitle")
    .textContent =
      "일정 추가";


  document
    .getElementById("eventText")
    .value =
      "";


  document
    .getElementById("eventColor")
    .value =
      "gray";


  const targetDate =
    date ||
    dateKey(selectedDate);


  document
    .getElementById("eventDate")
    .value =
      targetDate;


  document
    .getElementById("eventModal")
    .classList.add("show");

}


function openEditModal(event) {

  editingId =
    event.id;


  document
    .getElementById("eventModalTitle")
    .textContent =
      "일정 수정";


  document
    .getElementById("eventDate")
    .value =
      event.date;


  document
    .getElementById("eventText")
    .value =
      event.text;


  document
    .getElementById("eventColor")
    .value =
      event.color || "gray";


  document
    .getElementById("eventModal")
    .classList.add("show");

}


function closeEventModal() {

  document
    .getElementById("eventModal")
    .classList.remove("show");

  editingId =
    null;

}


/* =========================================================
   일정 저장
========================================================= */

async function saveEvent() {

  if (!isLoggedIn()) {

    alert(
      "관리자 로그인이 필요합니다."
    );

    return;

  }


  const date =
    document
      .getElementById("eventDate")
      .value;


  const text =
    document
      .getElementById("eventText")
      .value
      .trim();


  const color =
    document
      .getElementById("eventColor")
      .value;


  if (!date) {

    alert(
      "날짜를 선택해주세요."
    );

    return;

  }


  if (!text) {

    alert(
      "일정을 입력해주세요."
    );

    return;

  }


  /* 수정 */

  if (editingId !== null) {

    const oldEvent =
      events.find(
        event =>
          String(event.id) ===
          String(editingId)
      );


    if (!oldEvent) {

      return;

    }


    const oldDate =
      oldEvent.date;


    let sortOrder =
      oldEvent.sort_order;


    /*
      날짜가 바뀌면
      새 날짜의 마지막으로 이동
    */

    if (
      oldDate !== date
    ) {

      const sameDay =
        events.filter(
          event =>
            event.date ===
            date
        );


      sortOrder =
        sameDay.length;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("events")
        .update({

          date,

          text,

          color,

          sort_order:
            sortOrder

        })
        .eq(
          "id",
          editingId
        )
        .select()
        .single();


    if (error) {

      console.error(error);

      alert(
        "일정 수정 실패: " +
        error.message
      );

      return;

    }


    const index =
      events.findIndex(
        event =>
          String(event.id) ===
          String(editingId)
      );


    if (index !== -1) {

      events[index] =
        data;

    }


  }

  /* 새 일정 */

  else {

    const sameDay =
      events.filter(
        event =>
          event.date ===
          date
      );


    const sortOrder =
      sameDay.length;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("events")
        .insert({

          date,

          text,

          color,

          sort_order:
            sortOrder

        })
        .select()
        .single();


    if (error) {

      console.error(error);

      alert(
        "일정 추가 실패: " +
        error.message
      );

      return;

    }


    events.push(
      data
    );

  }


  closeEventModal();


  selectedDate =
    new Date(
      date +
      "T12:00:00"
    );


  render();

}


/* =========================================================
   일정 삭제
========================================================= */

async function deleteEvent(
  id
) {

  if (!isLoggedIn()) {

    return;

  }


  const ok =
    confirm(
      "이 일정을 삭제할까요?"
    );


  if (!ok) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("events")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(error);

    alert(
      "삭제 실패: " +
      error.message
    );

    return;

  }


  events =
    events.filter(
      event =>
        String(event.id) !==
        String(id)
    );


  /*
    삭제 후 해당 날짜의 순서 정리
  */

  normalizeLocalOrder();


  render();

}


/* =========================================================
   사이드 일정
========================================================= */

function renderSide() {

  const key =
    dateKey(
      selectedDate
    );


  document
    .getElementById("selectedDateTitle")
    .textContent =
      `${selectedDate.getFullYear()}년 ${
        selectedDate.getMonth() + 1
      }월 ${
        selectedDate.getDate()
      }일`;


  const side =
    document
      .getElementById("sideEvents");


  side.innerHTML =
    "";


  const dayEvents =
    events
      .filter(
        event =>
          event.date ===
          key
      )
      .sort(
        (a, b) =>
          Number(a.sort_order ?? 0) -
          Number(b.sort_order ?? 0)
      );


  if (
    dayEvents.length ===
    0
  ) {

    side.innerHTML =
      `
        <div class="side-empty">
          등록된 일정이 없습니다.
        </div>
      `;

    return;

  }


  dayEvents.forEach(
    event => {

      const el =
        document.createElement(
          "div"
        );


      el.className =
        `side-event ${
          event.color || "gray"
        }`;


      el.style.background =
        getEventColor(
          event.color
        );


      el.style.color =
        getEventTextColor(
          event.color
        );


      el.innerHTML =
        formatText(
          event.text
        );


      el.onclick = () => {

        if (
          isLoggedIn()
        ) {

          openEditModal(
            event
          );

        }

      };


      side.appendChild(
        el
      );

    }
  );

}


function getEventColor(
  color
) {

  const colors = {

    gray: "#e3e3e3",

    green: "#dcebd5",

    yellow: "#fff0c5",

    pink: "#f5dce1",

    blue: "#dbe7f8",

    purple: "#e7ddf5"

  };


  return (
    colors[color] ||
    colors.gray
  );

}


function getEventTextColor(
  color
) {

  const colors = {

    gray: "#444",

    green: "#355a31",

    yellow: "#66521b",

    pink: "#693c46",

    blue: "#355278",

    purple: "#5b4376"

  };


  return (
    colors[color] ||
    colors.gray
  );

}


/* =========================================================
   월 이동
========================================================= */

function changeMonth(
  amount
) {

  currentDate =
    new Date(
      currentDate.getFullYear(),
      currentDate.getMonth() +
        amount,
      1
    );


  render();

}


/* =========================================================
   오늘
========================================================= */

function goToday() {

  const today =
    new Date();


  currentDate =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );


  selectedDate =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


  render();

}


/* =========================================================
   초기화
========================================================= */

async function init() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  window.__session =
    session;


  updateAuthUI(
    !!session
  );


  await loadEvents();

}


supabaseClient
  .auth
  .onAuthStateChange(
    (_event, session) => {

      window.__session =
        session;

      updateAuthUI(
        !!session
      );

    }
  );


setupDragAndDrop();

init();

</script>
