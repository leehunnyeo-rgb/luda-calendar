<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>루다의 캘린더</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f7;
    color: #333;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   전체
========================= */

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
}

/* =========================
   헤더
========================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
}

.title-area h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
}

.title-area p {
    margin: 6px 0 0;
    color: #888;
    font-size: 14px;
}

.auth-area {
    display: flex;
    align-items: center;
    gap: 8px;
}

.auth-status {
    font-size: 13px;
    color: #777;
}

.btn {
    border: 0;
    border-radius: 10px;
    padding: 9px 14px;
    font-weight: 700;
    transition: 0.15s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: #333;
    color: white;
}

.btn-secondary {
    background: #e8e8eb;
    color: #333;
}

.btn-danger {
    background: #e74c3c;
    color: white;
}

.btn-small {
    padding: 7px 11px;
    font-size: 13px;
}

/* =========================
   캘린더
========================= */

.calendar-card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    overflow: hidden;
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid #eee;
}

.month-title {
    font-size: 22px;
    font-weight: 800;
}

.month-controls {
    display: flex;
    gap: 6px;
}

.month-btn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 9px;
    background: #f0f0f2;
    font-size: 18px;
}

.month-btn:hover {
    background: #e3e3e6;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #fafafa;
    border-bottom: 1px solid #eee;
}

.weekday {
    padding: 11px 5px;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    color: #777;
}

.weekday:first-child {
    color: #e74c3c;
}

.weekday:last-child {
    color: #4a78d0;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
}

/* =========================
   날짜 칸
========================= */

.day {
    position: relative;
    min-height: 135px;
    border-right: 1px solid #eee;
    border-bottom: 1px solid #eee;
    background: white;
    padding: 8px;
    overflow: hidden;
}

.day:nth-child(7n) {
    border-right: 0;
}

.day.empty {
    background: #fafafa;
}

.day-number {
    position: relative;
    z-index: 3;
    width: 27px;
    height: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
}

.day.today .day-number {
    background: #333;
    color: white;
}

.day.sunday .day-number {
    color: #e74c3c;
}

.day.saturday .day-number {
    color: #4a78d0;
}

.day.addable {
    cursor: pointer;
}

.day.addable:hover {
    background: #fafafa;
}

/* =========================
   일정
========================= */

.events {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 5px;
}

.event {
    position: relative;
    min-height: 27px;
    padding: 5px 7px;
    border-radius: 6px;
    background: #f1f1f1;
    color: #444;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    word-break: break-word;
    cursor: pointer;
}

.event:hover {
    filter: brightness(0.96);
}

/* 색상 */

.event-gray {
    background: #dcdcdc;
    color: #444;
}

.event-green {
    background: #bfe8c6;
    color: #245b2e;
}

.event-yellow {
    background: #ffe89a;
    color: #675500;
}

.event-purple {
    background: #d9c4f2;
    color: #503276;
}

/* =========================
   일정 하나일 때 날짜 전체
========================= */

.day.single-event {
    padding: 0;
}

.day.single-event .day-number {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 4;
}

.day.single-event .events {
    position: absolute;
    inset: 0;
    margin: 0;
    z-index: 1;
}

.day.single-event .event {
    width: 100%;
    height: 100%;
    min-height: 100%;
    border-radius: 0;
    padding: 42px 12px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 14px;
}

/*
   색상 없음인 경우에는 날짜 전체를 칠하지 않고
   일반 일정 형태로 표시
*/
.day.single-event.no-color-event {
    padding: 8px;
}

.day.single-event.no-color-event .day-number {
    position: relative;
    top: auto;
    left: auto;
}

.day.single-event.no-color-event .events {
    position: relative;
    inset: auto;
    margin-top: 5px;
}

.day.single-event.no-color-event .event {
    height: auto;
    min-height: 27px;
    border-radius: 6px;
    padding: 7px;
    display: block;
}

/* =========================
   로그인/모달
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modal h2 {
    margin: 0 0 20px;
    font-size: 21px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
    color: #555;
}

.form-group input,
.form-group select {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 11px 12px;
    outline: none;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #888;
}

.modal-buttons {
    display: flex;
    gap: 8px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
}

.modal-close {
    float: right;
    border: 0;
    background: none;
    font-size: 22px;
    color: #888;
}

/* =========================
   상태 / 안내
========================= */

.info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 14px 0;
    padding: 11px 14px;
    border-radius: 10px;
    background: #fff;
    color: #777;
    font-size: 13px;
}

.error-message {
    display: none;
    margin-bottom: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #ffe3e0;
    color: #b42318;
    font-size: 13px;
    white-space: pre-wrap;
}

.error-message.show {
    display: block;
}

.loading {
    padding: 50px;
    text-align: center;
    color: #999;
}

/* =========================
   모바일
========================= */

@media (max-width: 700px) {
    .container {
        padding: 10px;
    }

    .header {
        align-items: flex-start;
    }

    .title-area h1 {
        font-size: 22px;
    }

    .auth-status {
        display: none;
    }

    .calendar-header {
        padding: 13px;
    }

    .month-title {
        font-size: 18px;
    }

    .day {
        min-height: 90px;
        padding: 5px;
    }

    .day-number {
        width: 23px;
        height: 23px;
        font-size: 11px;
    }

    .event {
        font-size: 10px;
        padding: 4px;
    }

    .day.single-event .event {
        padding: 35px 5px 5px;
        font-size: 11px;
    }

    .day.single-event.no-color-event {
        padding: 5px;
    }

    .day.single-event.no-color-event .event {
        padding: 5px;
    }

    .weekday {
        font-size: 11px;
        padding: 8px 2px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="title-area">
            <h1>루다의 캘린더</h1>
            <p id="description">
                일정을 확인할 수 있습니다.
            </p>
        </div>

        <div class="auth-area">
            <span class="auth-status" id="authStatus">
                로그인 확인 중...
            </span>

            <button
                class="btn btn-primary btn-small"
                id="loginButton"
                onclick="openLoginModal()"
            >
                관리자 로그인
            </button>

            <button
                class="btn btn-secondary btn-small"
                id="logoutButton"
                onclick="logout()"
                style="display:none;"
            >
                로그아웃
            </button>
        </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="info-bar">
        <span id="permissionText">
            일정을 불러오는 중...
        </span>

        <button
            class="btn btn-secondary btn-small"
            onclick="goToday()"
        >
            오늘
        </button>
    </div>

    <div class="calendar-card">

        <div class="calendar-header">

            <button
                class="month-btn"
                onclick="changeMonth(-1)"
                aria-label="이전 달"
            >
                ‹
            </button>

            <div class="month-title" id="monthTitle"></div>

            <button
                class="month-btn"
                onclick="changeMonth(1)"
                aria-label="다음 달"
            >
                ›
            </button>

        </div>

        <div class="weekdays">
            <div class="weekday">일</div>
            <div class="weekday">월</div>
            <div class="weekday">화</div>
            <div class="weekday">수</div>
            <div class="weekday">목</div>
            <div class="weekday">금</div>
            <div class="weekday">토</div>
        </div>

        <div
            class="calendar-grid"
            id="calendarGrid"
        >
            <div class="loading">
                캘린더를 불러오는 중...
            </div>
        </div>

    </div>

</div>


<!-- =========================
     로그인 모달
========================= -->

<div
    class="modal-overlay"
    id="loginModal"
    onclick="closeModalByBackground(event, 'loginModal')"
>

    <div class="modal">

        <button
            class="modal-close"
            onclick="closeLoginModal()"
        >
            ×
        </button>

        <h2>관리자 로그인</h2>

        <div class="form-group">
            <label for="emailInput">이메일</label>
            <input
                id="emailInput"
                type="email"
                autocomplete="email"
                placeholder="관리자 이메일"
            >
        </div>

        <div class="form-group">
            <label for="passwordInput">비밀번호</label>
            <input
                id="passwordInput"
                type="password"
                autocomplete="current-password"
                placeholder="비밀번호"
            >
        </div>

        <div class="modal-buttons">

            <button
                class="btn btn-secondary"
                onclick="closeLoginModal()"
            >
                취소
            </button>

            <button
                class="btn btn-primary"
                onclick="login()"
            >
                로그인
            </button>

        </div>

    </div>

</div>


<!-- =========================
     일정 모달
========================= -->

<div
    class="modal-overlay"
    id="eventModal"
    onclick="closeModalByBackground(event, 'eventModal')"
>

    <div class="modal">

        <button
            class="modal-close"
            onclick="closeEventModal()"
        >
            ×
        </button>

        <h2 id="eventModalTitle">일정 추가</h2>

        <div class="form-group">
            <label for="dateInput">날짜</label>
            <input
                id="dateInput"
                type="date"
            >
        </div>

        <div class="form-group">
            <label for="titleInput">일정</label>
            <input
                id="titleInput"
                type="text"
                maxlength="100"
                placeholder="일정 내용을 입력하세요"
                autocomplete="off"
            >
        </div>

        <div class="form-group">
            <label for="colorInput">색상</label>

            <select id="colorInput">

                <!-- 기본값은 색상 없음 -->
                <option value="">
                    색상 없음
                </option>

                <option value="gray">
                    회색
                </option>

                <option value="green">
                    초록
                </option>

                <option value="yellow">
                    노랑
                </option>

                <option value="purple">
                    보라
                </option>

            </select>
        </div>

        <div class="modal-buttons">

            <button
                class="btn btn-secondary"
                onclick="closeEventModal()"
            >
                취소
            </button>

            <button
                class="btn btn-danger"
                id="deleteButton"
                onclick="deleteEvent()"
                style="display:none;"
            >
                삭제
            </button>

            <button
                class="btn btn-primary"
                id="saveButton"
                onclick="saveEvent()"
            >
                저장
            </button>

        </div>

    </div>

</div>


<script>
/* =========================================================
   Supabase 설정
========================================================= */

const SUPABASE_URL =
    "https://invachujoiisrbhkzhzc.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_1-PfSu1n9AE0PdTKTQExFA_tIsfTJmZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   전역 상태
========================================================= */

let currentDate = new Date();

let events = [];

let isAdmin = false;

let currentUser = null;

let editingEventId = null;


/* =========================================================
   짧은 DOM 함수
========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   오류 표시
========================================================= */

function showError(message) {

    console.error(message);

    const box = $("errorMessage");

    box.textContent = message;

    box.classList.add("show");
}

function clearError() {

    const box = $("errorMessage");

    box.textContent = "";

    box.classList.remove("show");
}


/* =========================================================
   인증 확인
========================================================= */

async function checkAuth() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {
            throw error;
        }

        currentUser =
            data.session
                ? data.session.user
                : null;

        isAdmin = !!currentUser;

        updateAuthUI();

    } catch (error) {

        isAdmin = false;

        currentUser = null;

        updateAuthUI();

        showError(
            "로그인 상태를 확인하는 중 오류가 발생했습니다.\n" +
            error.message
        );
    }
}


/* =========================================================
   로그인 상태 UI
========================================================= */

function updateAuthUI() {

    if (isAdmin) {

        $("authStatus").textContent =
            "관리자 로그인됨";

        $("loginButton").style.display =
            "none";

        $("logoutButton").style.display =
            "inline-block";

        $("permissionText").textContent =
            "관리자 모드 · 날짜를 클릭하여 일정을 추가할 수 있습니다.";

        $("description").textContent =
            "관리자 로그인 상태입니다.";

    } else {

        $("authStatus").textContent =
            "방문자";

        $("loginButton").style.display =
            "inline-block";

        $("logoutButton").style.display =
            "none";

        $("permissionText").textContent =
            "일정 보기만 가능합니다. 일정을 추가하려면 관리자 로그인이 필요합니다.";

        $("description").textContent =
            "일정을 확인할 수 있습니다.";
    }

    renderCalendar();
}


/* =========================================================
   로그인 모달
========================================================= */

function openLoginModal() {

    clearError();

    $("loginModal").classList.add("show");

    setTimeout(() => {
        $("emailInput").focus();
    }, 100);
}


function closeLoginModal() {

    $("loginModal").classList.remove("show");
}


async function login() {

    clearError();

    const email =
        $("emailInput").value.trim();

    const password =
        $("passwordInput").value;

    if (!email || !password) {

        showError(
            "이메일과 비밀번호를 입력해주세요."
        );

        return;
    }

    const button =
        document.querySelector(
            "#loginModal .btn-primary"
        );

    button.disabled = true;

    button.textContent =
        "로그인 중...";

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            throw error;
        }

        currentUser = data.user;

        isAdmin = true;

        updateAuthUI();

        closeLoginModal();

        $("passwordInput").value = "";

    } catch (error) {

        showError(
            "로그인에 실패했습니다.\n" +
            error.message
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "로그인";
    }
}


/* =========================================================
   로그아웃
========================================================= */

async function logout() {

    clearError();

    const {
        error
    } = await supabaseClient.auth.signOut();

    if (error) {

        showError(
            "로그아웃에 실패했습니다.\n" +
            error.message
        );

        return;
    }

    currentUser = null;

    isAdmin = false;

    closeEventModal();

    updateAuthUI();
}


/* =========================================================
   인증 상태 변경 감지
========================================================= */

supabaseClient.auth.onAuthStateChange(
    (_event, session) => {

        currentUser =
            session
                ? session.user
                : null;

        isAdmin = !!session;

        updateAuthUI();
    }
);


/* =========================================================
   Supabase에서 일정 불러오기
========================================================= */

async function loadEvents() {

    clearError();

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("events")
            .select("*")
            .order("date", {
                ascending: true
            });

        if (error) {
            throw error;
        }

        events = data || [];

        renderCalendar();

    } catch (error) {

        events = [];

        renderCalendar();

        showError(
            "일정을 불러오지 못했습니다.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   캘린더 날짜 계산
========================================================= */

function formatDate(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function getEventsForDate(dateString) {

    return events.filter(
        event =>
            event.date === dateString
    );
}


/* =========================================================
   캘린더 렌더링
========================================================= */

function renderCalendar() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const monthNames = [
        "1월",
        "2월",
        "3월",
        "4월",
        "5월",
        "6월",
        "7월",
        "8월",
        "9월",
        "10월",
        "11월",
        "12월"
    ];

    $("monthTitle").textContent =
        `${year}년 ${monthNames[month]}`;

    const grid =
        $("calendarGrid");

    grid.innerHTML = "";

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();

    const lastDate =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    /* 이전 달 빈칸 */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        grid.appendChild(empty);
    }


    /* 날짜 */

    const today =
        new Date();

    const todayString =
        formatDate(today);

    for (
        let dayNumber = 1;
        dayNumber <= lastDate;
        dayNumber++
    ) {

        const date =
            new Date(
                year,
                month,
                dayNumber
            );

        const dateString =
            formatDate(date);

        const dayEvents =
            getEventsForDate(
                dateString
            );

        const dayEl =
            document.createElement("div");

        dayEl.className =
            "day";

        if (
            dateString === todayString
        ) {
            dayEl.classList.add("today");
        }

        if (
            date.getDay() === 0
        ) {
            dayEl.classList.add("sunday");
        }

        if (
            date.getDay() === 6
        ) {
            dayEl.classList.add("saturday");
        }

        if (isAdmin) {
            dayEl.classList.add("addable");
        }


        /* 날짜 번호 */

        const numberEl =
            document.createElement("div");

        numberEl.className =
            "day-number";

        numberEl.textContent =
            dayNumber;

        dayEl.appendChild(
            numberEl
        );


        /* 일정 영역 */

        const eventsEl =
            document.createElement("div");

        eventsEl.className =
            "events";


        /* 일정이 정확히 하나일 때 */

        if (
            dayEvents.length === 1
        ) {

            const event =
                dayEvents[0];

            if (event.color) {

                dayEl.classList.add(
                    "single-event"
                );

            } else {

                dayEl.classList.add(
                    "single-event",
                    "no-color-event"
                );
            }
        }


        /* 일정 출력 */

        dayEvents.forEach(
            event => {

                const eventEl =
                    document.createElement("div");

                eventEl.className =
                    "event";

                if (event.color) {

                    eventEl.classList.add(
                        `event-${event.color}`
                    );
                }

                eventEl.textContent =
                    event.title;

                eventEl.title =
                    isAdmin
                        ? "클릭하여 수정"
                        : event.title;


                /* 관리자만 수정 가능 */

                if (isAdmin) {

                    eventEl.addEventListener(
                        "click",
                        function(e) {

                            e.stopPropagation();

                            openEditModal(event);
                        }
                    );
                }

                eventsEl.appendChild(
                    eventEl
                );
            }
        );


        dayEl.appendChild(
            eventsEl
        );


        /* 날짜 클릭 */

        dayEl.addEventListener(
            "click",
            function() {

                if (!isAdmin) {
                    return;
                }

                /*
                    일정이 있는 날짜를 클릭하면
                    첫 번째 일정을 수정.
                    일정이 없는 날짜는 새 일정 추가.
                */

                if (
                    dayEvents.length > 0
                ) {

                    openEditModal(
                        dayEvents[0]
                    );

                } else {

                    openAddModal(
                        dateString
                    );
                }
            }
        );


        grid.appendChild(
            dayEl
        );
    }
}


/* =========================================================
   이전/다음 달
========================================================= */

function changeMonth(amount) {

    currentDate =
        new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + amount,
            1
        );

    renderCalendar();
}


function goToday() {

    const now =
        new Date();

    currentDate =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            1
        );

    renderCalendar();
}


/* =========================================================
   일정 추가 모달
========================================================= */

function openAddModal(dateString) {

    if (!isAdmin) {
        return;
    }

    clearError();

    editingEventId = null;

    $("eventModalTitle").textContent =
        "일정 추가";

    $("dateInput").value =
        dateString;

    $("titleInput").value =
        "";

    /*
       ★ 핵심
       새 일정의 기본 색상은 "없음"
    */
    $("colorInput").value =
        "";

    $("deleteButton").style.display =
        "none";

    $("saveButton").textContent =
        "저장";

    $("eventModal").classList.add(
        "show"
    );

    setTimeout(() => {

        $("titleInput").focus();

    }, 100);
}


/* =========================================================
   일정 수정 모달
========================================================= */

function openEditModal(event) {

    if (!isAdmin) {
        return;
    }

    clearError();

    editingEventId =
        event.id;

    $("eventModalTitle").textContent =
        "일정 수정";

    $("dateInput").value =
        event.date;

    $("titleInput").value =
        event.title;

    /*
       색상이 없는 기존 일정이면
       빈 값으로 표시
    */
    $("colorInput").value =
        event.color || "";

    $("deleteButton").style.display =
        "block";

    $("saveButton").textContent =
        "저장";

    $("eventModal").classList.add(
        "show"
    );

    setTimeout(() => {

        $("titleInput").focus();

        $("titleInput").select();

    }, 100);
}


/* =========================================================
   일정 모달 닫기
========================================================= */

function closeEventModal() {

    $("eventModal").classList.remove(
        "show"
    );

    editingEventId = null;
}


/* =========================================================
   일정 저장
========================================================= */

async function saveEvent() {

    if (!isAdmin) {

        showError(
            "관리자 로그인 후 사용할 수 있습니다."
        );

        return;
    }

    clearError();

    const date =
        $("dateInput").value;

    const title =
        $("titleInput").value.trim();

    const color =
        $("colorInput").value;


    if (!date) {

        showError(
            "날짜를 선택해주세요."
        );

        return;
    }

    if (!title) {

        showError(
            "일정 내용을 입력해주세요."
        );

        $("titleInput").focus();

        return;
    }


    const saveButton =
        $("saveButton");

    saveButton.disabled = true;

    saveButton.textContent =
        "저장 중...";


    try {

        let result;


        /* 수정 */

        if (editingEventId) {

            result =
                await supabaseClient
                    .from("events")
                    .update({
                        date: date,
                        title: title,
                        color: color
                    })
                    .eq(
                        "id",
                        editingEventId
                    )
                    .select()
                    .single();


        /* 신규 */

        } else {

            result =
                await supabaseClient
                    .from("events")
                    .insert({
                        id: crypto.randomUUID(),
                        date: date,
                        title: title,
                        color: color
                    })
                    .select()
                    .single();
        }


        if (result.error) {
            throw result.error;
        }


        /* 화면 데이터 갱신 */

        if (editingEventId) {

            const index =
                events.findIndex(
                    event =>
                        event.id ===
                        editingEventId
                );

            if (index !== -1) {

                events[index] =
                    result.data;
            }

        } else {

            events.push(
                result.data
            );
        }


        closeEventModal();

        renderCalendar();


    } catch (error) {

        showError(
            "일정 저장에 실패했습니다.\n\n" +
            error.message
        );

    } finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            "저장";
    }
}


/* =========================================================
   일정 삭제
========================================================= */

async function deleteEvent() {

    if (!isAdmin) {
        return;
    }

    if (!editingEventId) {
        return;
    }


    const event =
        events.find(
            item =>
                item.id ===
                editingEventId
        );


    if (!event) {
        return;
    }


    const confirmed =
        confirm(
            `"${event.title}" 일정을 삭제할까요?`
        );


    if (!confirmed) {
        return;
    }


    clearError();


    const button =
        $("deleteButton");

    button.disabled = true;

    button.textContent =
        "삭제 중...";


    try {

        const {
            error
        } =
        await supabaseClient
            .from("events")
            .delete()
            .eq(
                "id",
                editingEventId
            );


        if (error) {
            throw error;
        }


        events =
            events.filter(
                item =>
                    item.id !==
                    editingEventId
            );


        closeEventModal();

        renderCalendar();


    } catch (error) {

        showError(
            "일정 삭제에 실패했습니다.\n\n" +
            error.message
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "삭제";
    }
}


/* =========================================================
   Enter = 저장
========================================================= */

/*
   일정 제목 입력창에서 Enter를 누르면
   저장 버튼을 직접 클릭하지 않아도 저장된다.
*/

$("titleInput").addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            saveEvent();
        }
    }
);


/*
   로그인 비밀번호 입력창에서도
   Enter = 로그인
*/

$("passwordInput").addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            login();
        }
    }
);


/* =========================================================
   ESC = 모달 닫기
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Escape"
        ) {
            return;
        }

        closeLoginModal();

        closeEventModal();
    }
);


/* =========================================================
   모달 배경 클릭 닫기
========================================================= */

function closeModalByBackground(
    event,
    modalId
) {

    if (
        event.target.id === modalId
    ) {

        if (
            modalId ===
            "loginModal"
        ) {

            closeLoginModal();

        } else {

            closeEventModal();
        }
    }
}


/* =========================================================
   시작
========================================================= */

async function init() {

    /*
       먼저 로그인 상태 확인
    */

    await checkAuth();

    /*
       그 다음 DB에서 일정 불러오기
    */

    await loadEvents();
}


init();

</script>
