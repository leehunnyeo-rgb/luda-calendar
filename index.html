<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>루다의 2026 캘린더</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f5f3f8; --card: #fff; --ink: #292731; --muted: #8c8895;
      --line: #e7e3eb; --lav: #dcd5ef; --lav2: #f0ebf8; --blue: #4777c7; --red: #d86e75;
      --yellow: #fff0bc; --gray: #dedede; --green: #dcebd3; --shadow: 0 18px 50px rgba(52, 42, 72, .09);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(135deg, #f7f5fa, #eeebf3); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    
    .app { max-width: 1450px; margin: 0 auto; padding: 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { width: 44px; height: 44px; border-radius: 14px; background: #cfc4e7; display: grid; place-items: center; font-weight: 800; color: #4d4560; box-shadow: inset 0 1px #fff; }
    .brand h1 { font-size: 20px; margin: 0; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .controls { display: flex; gap: 8px; align-items: center; }
    .iconbtn, .todaybtn { border: 1px solid var(--line); background: #fff; border-radius: 11px; height: 38px; padding: 0 12px; color: #55505f; }
    .iconbtn { width: 38px; padding: 0; font-size: 18px; }
    .todaybtn { font-weight: 700; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
    .calendar-card, .side { background: rgba(255, 255, 255, .88); border: 1px solid rgba(225, 220, 232, .9); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
    
    .monthhead { background: linear-gradient(90deg, #d9d0ec, #e4def1); padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; }
    .monthtitle { display: flex; align-items: baseline; gap: 12px; }
    .monthtitle .year { font-size: 18px; font-weight: 800; }
    .monthtitle .month { font-size: 31px; font-weight: 900; letter-spacing: -1px; }
    .monthtitle .kr { font-size: 15px; font-weight: 700; color: #655d72; }
    .monthnav { display: flex; gap: 8px; }
    .monthnav button { border: 0; background: rgba(255, 255, 255, .55); width: 36px; height: 36px; border-radius: 10px; color: #51495e; }

    .weekdays, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekdays { background: #fbfafc; border-bottom: 1px solid var(--line); }
    .weekday { height: 38px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #77727d; }
    .weekday.sat { color: var(--blue); }
    .weekday.sun { color: var(--red); }

    .grid { background: var(--line); gap: 1px; }
    .day { min-height: 145px; background: #fff; padding: 10px; position: relative; display: flex; flex-direction: column; gap: 7px; transition: .15s; }
    .day:hover { background: #fdfcff; }
    .day.out { background: #faf9fb; color: #aaa; }
    .daynum { font-size: 13px; font-weight: 800; align-self: flex-start; }
    .day.sat .daynum { color: var(--blue); }
    .day.sun .daynum { color: var(--red); }
    .day.out .daynum { color: #999; }

    .event { border-radius: 7px; padding: 9px 8px; font-size: 12px; line-height: 1.35; font-weight: 650; min-height: 42px; display: flex; align-items: center; justify-content: center; text-align: center; white-space: pre-line; cursor: pointer; transition: transform 0.1s; }
    .event:hover { transform: scale(1.02); }
    .event.gray { background: var(--gray); }
    .event.yellow { background: var(--yellow); }
    .event.green { background: var(--green); }
    .event.purple { background: #e9e1f6; }
    .event.blue { background: #dfeafb; }

    .day.addable:after { content: '+'; position: absolute; right: 9px; bottom: 8px; width: 23px; height: 23px; border-radius: 8px; background: #f1eef5; color: #aaa; display: grid; place-items: center; opacity: 0; transition: .15s; }
    .day.addable:hover:after { opacity: 1; }

    .side { padding: 18px; }
    .side h2 { font-size: 15px; margin: 2px 0 14px; }
    .side-section { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .side-section:last-child { border-bottom: 0; }
    .bigdate { font-size: 30px; font-weight: 900; letter-spacing: -1px; }
    .muted { color: var(--muted); font-size: 12px; }
    .eventrow { display: flex; gap: 10px; align-items: flex-start; margin: 11px 0; cursor: pointer; }
    .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
    .dot.yellow { background: #e5bd45; }
    .dot.gray { background: #a9a9a9; }
    .dot.green { background: #7fac68; }
    .dot.purple { background: #9a7bc5; }
    .dot.blue { background: #4777c7; }
    .eventrow strong { font-size: 13px; }
    .eventrow span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }

    .add { width: 100%; border: 0; border-radius: 12px; background: #4e465b; color: #fff; padding: 11px 12px; font-weight: 800; margin-top: 8px; }
    .hint { font-size: 11px; color: #9b96a2; line-height: 1.5; margin-top: 10px; }

    .modal { position: fixed; inset: 0; background: rgba(37, 31, 47, .35); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
    .modal.open { display: flex; }
    .dialog { width: min(440px, 100%); background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 30px 80px rgba(20, 15, 30, .25); }
    .dialog h3 { margin: 0 0 14px; }
    .form { display: grid; gap: 11px; }
    .form label { font-size: 12px; font-weight: 800; color: #67616d; }
    .form input, .form select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; outline: none; }
    
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .actions-right { display: flex; gap: 8px; }
    .actions button { border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
    .cancel { background: #f0edf3; }
    .save { background: #4e465b; color: #fff; font-weight: 800; }
    .delete-btn { background: #d86e75; color: #fff; font-weight: 800; display: none; }

    @media(max-width: 1050px) { .layout { grid-template-columns: 1fr; } .side { display: none; } .day { min-height: 120px; } }
    @media(max-width: 680px) { .app { padding: 10px; } .topbar { margin-bottom: 10px; } .brand h1 { font-size: 16px; } .brand p { display: none; } .monthhead { padding: 16px; } .monthtitle .month { font-size: 24px; } .monthtitle .year { font-size: 14px; } .monthtitle .kr { display: none; } .day { min-height: 86px; padding: 6px; } .event { font-size: 10px; padding: 6px; min-height: 30px; } .weekday { height: 32px; font-size: 10px; } .daynum { font-size: 11px; } .todaybtn { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="mark">L</div>
        <div>
          <h1>루다의 캘린더</h1>
          <p>일정은 한눈에, 기록은 가볍게</p>
        </div>
      </div>
      <div class="controls">
        <button class="todaybtn" id="todayBtn">오늘</button>
        <button class="iconbtn" id="addBtn" title="일정 추가">＋</button>
      </div>
    </div>
    
    <div class="layout">
      <main class="calendar-card">
        <div class="monthhead">
          <div class="monthtitle">
            <span class="year" id="year"></span>
            <span class="month" id="month"></span>
            <span class="kr">월</span>
          </div>
          <div class="monthnav">
            <button class="iconbtn" id="prev">‹</button>
            <button class="iconbtn" id="next">›</button>
          </div>
        </div>
        <div class="weekdays">
          <div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div>
          <div class="weekday">목</div><div class="weekday">금</div><div class="weekday sat">토</div>
          <div class="weekday sun">일</div>
        </div>
        <div class="grid" id="grid"></div>
      </main>
      
      <aside class="side">
        <div class="side-section">
          <div class="muted" id="selectedLabel">선택한 날짜</div>
          <div class="bigdate" id="selectedDate">10.01</div>
        </div>
        <div class="side-section">
          <h2>이번 달 일정</h2>
          <div id="upcoming"></div>
        </div>
        <div class="side-section">
          <button class="add" id="sideAdd">+ 일정 추가</button>
          <div class="hint">일정을 클릭하면 **수정**하거나 **삭제**할 수 있습니다.</div>
        </div>
      </aside>
    </div>
  </div>

  <!-- 일정 추가/수정 모달 -->
  <div class="modal" id="modal">
    <div class="dialog">
      <h3 id="modalTitle">일정 추가</h3>
      <div class="form">
        <label>날짜<input type="date" id="dateInput"></label>
        <label>일정 내용<input id="titleInput" placeholder="예: 영화 / 휴방 / 약속"></label>
        <label>색상
          <select id="colorInput">
            <option value="gray">회색</option>
            <option value="yellow">노랑</option>
            <option value="green">연두</option>
            <option value="purple">보라</option>
            <option value="blue">파랑</option>
          </select>
        </label>
        
        <div class="actions">
          <button class="delete-btn" id="deleteBtn">삭제</button>
          <div class="actions-right">
            <button class="cancel" id="cancel">취소</button>
            <button class="save" id="save">저장</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Supabase 설정
    const SUPABASE_URL = 'https://invachujoiisrbhkzhzc.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY'; // 본인 키로 교체하세요

    let supabaseClient = null;
    if (typeof supabase !== 'undefined' && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY') {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const initialEvents = [
      { id: '1', date: '2026-09-29', title: '휴방', color: 'gray' },
      { id: '2', date: '2026-09-30', title: '휴방', color: 'gray' },
      { id: '3', date: '2026-10-01', title: '예소노탐정', color: 'green' },
      { id: '4', date: '2026-10-02', title: 'Graveyard Keeper 2', color: 'gray' },
      { id: '5', date: '2026-10-03', title: 'Graveyard Keeper 2\n<에반게리온 극장판>', color: 'gray' },
      { id: '6', date: '2026-10-07', title: '휴방', color: 'gray' },
      { id: '7', date: '2026-10-08', title: '휴방', color: 'gray' },
      { id: '8', date: '2026-10-10', title: '루다극장', color: 'yellow' },
      { id: '9', date: '2026-10-14', title: '휴방', color: 'gray' },
      { id: '10', date: '2026-10-17', title: '휴방', color: 'gray' },
      { id: '11', date: '2026-10-21', title: '휴방', color: 'gray' },
      { id: '12', date: '2026-10-23', title: '코요웹투터:\n모던웹메어', color: 'purple' },
      { id: '13', date: '2026-10-24', title: '루다극장', color: 'yellow' },
      { id: '14', date: '2026-10-25', title: '휴방', color: 'gray' },
      { id: '15', date: '2026-10-29', title: '휴방', color: 'gray' },
      { id: '16', date: '2026-10-30', title: '휴방', color: 'gray' },
      { id: '17', date: '2026-11-02', title: '여름방학 끝! 복귀', color: 'green' }
    ];

    let events = JSON.parse(localStorage.getItem('ludaCalendarEvents') || 'null') || initialEvents;
    let currentEditId = null; // 현재 수정 중인 일정 ID (null이면 새 일정 추가)

    let view = new Date(2026, 9, 1);
    let selected = new Date(2026, 9, 1);

    const $ = id => document.getElementById(id);

    function iso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    async function loadEventsFromSupabase() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient.from('events').select('*');
        if (!error && data && data.length > 0) {
          events = data;
          persist();
          render();
        }
      } catch (e) {
        console.error('Supabase 데이터 로드 실패:', e);
      }
    }

    function render() {
      $('year').textContent = view.getFullYear();$('month').textContent = view.getMonth() + 1;

      const first = new Date(view.getFullYear(), view.getMonth(), 1);
      let start = (first.getDay() + 6) % 7;
      const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
      const prevDays = new Date(view.getFullYear(), view.getMonth(), 0).getDate();

      let html = '';
      for (let i = 0; i < 42; i++) {
        let n = i - start + 1;
        let d = new Date(view.getFullYear(), view.getMonth(), n);
        let out = n < 1 || n > days;
        let actual = n < 1 ? prevDays + n : n > days ? n - days : n;
        
        let cls = 'day addable';
        let dow = i % 7;
        if (dow === 5) cls += ' sat';
        if (dow === 6) cls += ' sun';
        if (out) cls += ' out';

        let ev = events.filter(e => e.date === iso(d));
        
        html += `<div class="${cls}" data-date="${iso(d)}">
          <div class="daynum">${actual}</div>
          ${ev.map(e => `<div class="event ${e.color}" data-id="${e.id}" title="수정/삭제하려면 클릭">${escapeHtml(e.title)}</div>`).join('')}
        </div>`;
      }

      $('grid').innerHTML = html;

      // 일정 및 날짜 클릭 이벤트 바인딩
      document.querySelectorAll('.day').forEach(el => {
        el.addEventListener('click', e => {
          const targetEvent = e.target.closest('.event');
          if (targetEvent) {
            e.stopPropagation();
            const id = targetEvent.dataset.id;
            openEditModal(id);
            return;
          }
          selected = new Date(el.dataset.date + 'T12:00:00');
          openAddModal(el.dataset.date);
        });
      });

      renderSide();
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    }

    function renderSide() {
      $('selectedDate').textContent = `${String(selected.getMonth() + 1).padStart(2, '0')}.${String(selected.getDate()).padStart(2, '0')}`;
      const label = selected.toLocaleDateString('ko-KR', { weekday: 'long' });
      $('selectedLabel').textContent = label;

      const monthKey = `${view.getFullYear()}-${String(view.getMonth() + 1).padStart(2, '0')}`;
      const list = events.filter(e => e.date.startsWith(monthKey)).sort((a, b) => a.date.localeCompare(b.date));

      $('upcoming').innerHTML = list.length 
        ? list.map(e => `<div class="eventrow" onclick="openEditModal('${e.id}')">
            <i class="dot ${e.color}"></i>
            <div>
              <strong>${escapeHtml(e.title).replaceAll('\n', '<br>')}</strong>
              <span>${e.date.slice(5).replace('-', '.')}</span>
            </div>
          </div>`).join('') 
        : '<div class="muted">등록된 일정이 없어요.</div>';
    }

    function persist() {
      localStorage.setItem('ludaCalendarEvents', JSON.stringify(events));
    }

    // 새 일정 추가 모달 열기
    function openAddModal(date = iso(selected)) {
      currentEditId = null;
      $('modalTitle').textContent = '일정 추가';
      $('deleteBtn').style.display = 'none';$('dateInput').value = date;
      $('titleInput').value = '';
      $('colorInput').value = 'gray';$('modal').classList.add('open');
      setTimeout(() => $('titleInput').focus(), 50);
    }

    // 기존 일정 수정 모달 열기
    function openEditModal(id) {
      const item = events.find(e => String(e.id) === String(id));
      if (!item) return;

      currentEditId = id;
      $('modalTitle').textContent = '일정 수정';
      $('deleteBtn').style.display = 'block';$('dateInput').value = item.date;
      $('titleInput').value = item.title;
      $('colorInput').value = item.color \vert{}\vert{} 'gray';$('modal').classList.add('open');
      setTimeout(() => $('titleInput').focus(), 50);
    }

    function closeModal() {
      $('modal').classList.remove('open');
    }

    // 일정 저장/수정 함수
    async function saveEvent() {
      const date = $('dateInput').value;
      const title = $('titleInput').value.trim();
      const color = $('colorInput').value;

      if (!date || !title) return alert('날짜와 일정을 입력해 주세요.');

      if (currentEditId) {
        // 기존 일정 수정
        const targetIndex = events.findIndex(e => String(e.id) === String(currentEditId));
        if (targetIndex !== -1) {
          events[targetIndex] = { ...events[targetIndex], date, title, color };
          
          if (supabaseClient) {
            await supabaseClient.from('events').update({ date, title, color }).eq('id', currentEditId);
          }
        }
      } else {
        // 새 일정 추가
        const newObj = { id: Date.now().toString(), date, title, color };
        events.push(newObj);

        if (supabaseClient) {
          await supabaseClient.from('events').insert([newObj]);
        }
      }

      persist();
      selected = new Date(date + 'T12:00:00');
      view = new Date(selected.getFullYear(), selected.getMonth(), 1);
      closeModal();
      render();
    }

    // 일정 삭제 함수
    async function deleteEvent() {
      if (!currentEditId) return;
      if (!confirm('이 일정을 삭제하시겠습니까?')) return;

      events = events.filter(e => String(e.id) !== String(currentEditId));

      if (supabaseClient) {
        await supabaseClient.from('events').delete().eq('id', currentEditId);
      }

      persist();
      closeModal();
      render();
    }

    // 이벤트 리스너 바인딩
    $('prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };$('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
    $('todayBtn').onclick = () => { view = new Date(); selected = new Date(); render(); };$('addBtn').onclick = () => openAddModal();
    $('sideAdd').onclick = () => openAddModal();$('cancel').onclick = closeModal;
    $('save').onclick = saveEvent;
    $('deleteBtn').onclick = deleteEvent;

    $('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

    // 초기화 실행
    render();
    loadEventsFromSupabase();
  </script>
</body>
</html>
