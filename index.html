<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>루다의 일정표</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Malgun Gothic",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       전체
    ========================= */

    .app {
      width: min(1500px, 96%);
      margin: 25px auto 50px;
    }

    /* =========================
       상단
    ========================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
    }

    .brand p {
      margin: 3px 0 0;
      color: #888;
      font-size: 13px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-btn {
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 700;
    }

    .top-btn:hover {
      background: #f3f3f3;
    }

    .admin-badge {
      display: none;
      background: #222;
      color: white;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       레이아웃
    ========================= */

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 18px;
    }

    .calendar-card,
    .side {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
    }

    .calendar-card {
      overflow: hidden;
    }

    /* =========================
       월 헤더
    ========================= */

    .monthhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 22px;
      border-bottom: 1px solid #eee;
    }

    .monthtitle {
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-weight: 800;
    }

    .monthtitle .year {
      font-size: 18px;
      color: #777;
    }

    .monthtitle .month {
      font-size: 30px;
    }

    .monthtitle .kr {
      font-size: 18px;
      color: #777;
    }

    .monthnav {
      display: flex;
      gap: 7px;
    }

    .iconbtn {
      width: 40px;
      height: 40px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      font-size: 23px;
      line-height: 1;
    }

    .iconbtn:hover {
      background: #f5f5f5;
    }

    /* =========================
       요일
    ========================= */

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #eee;
    }

    .weekday {
      text-align: center;
      padding: 12px 4px;
      font-size: 13px;
      font-weight: 800;
      color: #777;
    }

    .weekday.sat {
      color: #5482c8;
    }

    .weekday.sun {
      color: #d46b6b;
    }

    /* =========================
       달력
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .day {
      position: relative;
      min-height: 145px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 8px;
      cursor: pointer;
      background: white;
    }

    .day:nth-child(7n) {
      border-right: 0;
    }

    .day:hover {
      background: #fafafa;
    }

    .day.muted {
      background: #fafafa;
      color: #bbb;
    }

    .day.today {
      background: #fffdf5;
    }

    .date {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .day.sat .date {
      color: #5482c8;
    }

    .day.sun .date {
      color: #d46b6b;
    }

    /* =========================
       일정 영역
    ========================= */

    .events {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /*
      일정 여러 개일 때 드래그 가능
    */

    .event {
      position: relative;
      width: 100%;
      padding: 7px 9px;
      border-radius: 7px;

      font-size: 12px;
      line-height: 1.35;
      font-weight: 700;

      white-space: pre-line;
      overflow-wrap: anywhere;

      user-select: none;

      cursor: pointer;

      transition:
        opacity 0.15s,
        transform 0.15s,
        box-shadow 0.15s;
    }

    .event:hover {
      filter: brightness(0.97);
    }

    /*
      관리자일 때만 드래그 커서
    */

    body.admin-mode .event {
      cursor: grab;
    }

    body.admin-mode .event:active {
      cursor: grabbing;
    }

    /*
      드래그 중
    */

    .event.dragging {
      opacity: 0.35;
      transform: scale(0.98);
    }

    /*
      드래그해서 들어갈 위치
    */

    .event.drag-over {
      box-shadow:
        0 -3px 0 #222;
    }

    /*
      색상
    */

    .event.gray {
      background: #e3e3e3;
      color: #444;
    }

    .event.green {
      background: #dcebd5;
      color: #355a31;
    }

    .event.yellow {
      background: #fff0c5;
      color: #66521b;
    }

    .event.pink {
      background: #f5dce1;
      color: #693c46;
    }

    .event.blue {
      background: #dbe7f8;
      color: #355278;
    }

    .event.purple {
      background: #e7ddf5;
      color: #57416e;
    }

    /* =========================
       사이드
    ========================= */

    .side {
      padding: 20px;
      height: fit-content;
    }

    .side-section {
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .side-section:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .muted {
      color: #999;
      font-size: 13px;
    }

    .bigdate {
      margin-top: 4px;
      font-size: 29px;
      font-weight: 800;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .eventrow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 0;
    }

    .eventrow .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-top: 6px;
      flex: 0 0 auto;
    }

    .dot.gray {
      background: #aaa;
    }

    .dot.green {
      background: #87b87d;
    }

    .dot.yellow {
      background: #e3c56d;
    }

    .dot.pink {
      background: #c98594;
    }

    .dot.blue {
      background: #7da0ce;
    }

    .dot.purple {
      background: #a185c2;
    }

    .eventrow strong {
      display: block;
      font-size: 13px;
      line-height: 1.4;
    }

    .eventrow span {
      display: block;
      margin-top: 2px;
      color: #999;
      font-size: 11px;
    }

    .add {
      width: 100%;
      border: 0;
      background: #222;
      color: white;
      border-radius: 10px;
      padding: 11px;
      font-weight: 800;
    }

    .add:hover {
      background: #333;
    }

    .hint {
      margin-top: 10px;
      color: #999;
      font-size: 11px;
      line-height: 1.5;
    }

    /* =========================
       로그인 모달
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.42);
      z-index: 1000;
      padding: 20px;
    }

    .dialog {
      width: min(430px, 100%);
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .dialog h3 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .form input,
    .form textarea,
    .form select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 9px;
      padding: 11px;
      outline: none;
      background: white;
    }

    .form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form input:focus,
    .form textarea:focus,
    .form select:focus {
      border-color: #888;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 5px;
    }

    .cancel,
    .save {
      border-radius: 9px;
      padding: 10px 15px;
      border: 1px solid #ddd;
      font-weight: 700;
    }

    .cancel {
      background: white;
    }

    .save {
      background: #222;
      color: white;
      border-color: #222;
    }

    /* =========================
       로그인 상태
    ========================= */

    .login-info {
      display: none;
      align-items: center;
      gap: 7px;
    }

    body.admin-mode .login-info {
      display: flex;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .app {
        width: 100%;
        margin: 0;
      }

      .topbar {
        padding: 14px;
        margin-bottom: 0;
      }

      .brand h1 {
        font-size: 18px;
      }

      .brand p {
        display: none;
      }

      .mark {
        width: 38px;
        height: 38px;
        font-size: 20px;
      }

      .calendar-card {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .monthhead {
        padding: 15px;
      }

      .monthtitle .month {
        font-size: 25px;
      }

      .day {
        min-height: 105px;
        padding: 5px;
      }

      .event {
        font-size: 10px;
        padding: 5px;
      }

      .date {
        font-size: 11px;
      }

      .top-btn {
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       상단
  ========================= -->

  <div class="topbar">

    <div class="brand">
      <div class="mark">L</div>

      <div>
        <h1>루다의 일정표</h1>
        <p>일정은 한눈에, 기록은 가볍게</p>
      </div>
    </div>

    <div class="top-actions">

      <div class="login-info">
        <div class="admin-badge" id="adminBadge">
          관리자
        </div>

        <button
          class="top-btn"
          onclick="logout()"
        >
          로그아웃
        </button>
      </div>

      <button
        class="top-btn"
        id="loginButton"
        onclick="openLoginModal()"
      >
        관리자 로그인
      </button>

      <button
        class="top-btn"
        onclick="goToday()"
      >
        오늘
      </button>

      <button
        class="top-btn"
        onclick="openAddModal()"
      >
        ＋ 일정
      </button>

    </div>

  </div>


  <!-- =========================
       달력
  ========================= -->

  <div class="layout">

    <main class="calendar-card">

      <div class="monthhead">

        <div class="monthtitle">
          <span class="year" id="year"></span>
          <span class="month" id="month"></span>
          <span class="kr">월</span>
        </div>

        <div class="monthnav">

          <button
            class="iconbtn"
            onclick="moveMonth(-1)"
          >
            ‹
          </button>

          <button
            class="iconbtn"
            onclick="moveMonth(1)"
          >
            ›
          </button>

        </div>

      </div>


      <div
        class="weekdays"
        id="weekdays"
      >
      </div>


      <div
        class="grid"
        id="grid"
      >
      </div>

    </main>


    <!-- =========================
         사이드
    ========================= -->

    <aside class="side">

      <div class="side-section">

        <div
          class="muted"
          id="selectedLabel"
        >
          선택한 날짜
        </div>

        <div
          class="bigdate"
          id="selectedDate"
        >
          10.01
        </div>

      </div>


      <div class="side-section">

        <h2>
          이번 달 일정
        </h2>

        <div id="upcoming">
        </div>

      </div>


      <div class="side-section">

        <button
          class="add"
          onclick="openAddModal()"
        >
          ＋ 일정 추가
        </button>

        <div class="hint">
          날짜 칸을 클릭해도 일정을 추가할 수 있어요.<br>
          관리자 로그인 후 같은 날짜의 일정을<br>
          마우스로 잡아 위아래로 움직일 수 있어요.
        </div>

      </div>

    </aside>

  </div>

</div>


<!-- =========================
     일정 추가 / 수정
========================= -->

<div
  class="modal"
  id="eventModal"
>

  <div class="dialog">

    <h3 id="eventModalTitle">
      일정 추가
    </h3>

    <div class="form">

      <label>
        날짜

        <input
          type="date"
          id="eventDate"
        >
      </label>


      <label>
        일정 내용

        <textarea
          id="eventText"
          placeholder="예: 휴방&#10;루다극장&#10;게임"
        ></textarea>

      </label>


      <label>
        색상

        <select id="eventColor">

          <option value="gray">
            회색
          </option>

          <option value="green">
            연두
          </option>

          <option value="yellow">
            노랑
          </option>

          <option value="pink">
            분홍
          </option>

          <option value="blue">
            파랑
          </option>

          <option value="purple">
            보라
          </option>

        </select>

      </label>


      <div class="actions">

        <button
          class="cancel"
          onclick="closeEventModal()"
        >
          취소
        </button>

        <button
          class="save"
          onclick="saveEvent()"
        >
          저장
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     로그인
========================= -->

<div
  class="modal"
  id="loginModal"
>

  <div class="dialog">

    <h3>
      관리자 로그인
    </h3>

    <div class="form">

      <label>
        이메일

        <input
          type="email"
          id="emailInput"
          placeholder="관리자 이메일"
          autocomplete="username"
        >
      </label>


      <label>
        비밀번호

        <input
          type="password"
          id="passwordInput"
          placeholder="비밀번호"
          autocomplete="current-password"
        >
      </label>


      <div class="actions">

        <button
          class="cancel"
          onclick="closeLoginModal()"
        >
          취소
        </button>

        <button
          class="save"
          onclick="login()"
        >
          로그인
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://invachujoiisrbhkzhzc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1-PfSu1n9AE0PdTKTQExFA_tIsfTJmZ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   상태
========================================================= */

let currentUser = null;

let events = [];

let currentDate =
  new Date(2026, 9, 1);

let selectedDate =
  new Date(2026, 9, 1);

let editingId = null;

let draggedEventId = null;


/* =========================================================
   날짜
========================================================= */

function dateKey(date) {

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth() + 1)
      .padStart(2, "0");

  const d =
    String(date.getDate())
      .padStart(2, "0");

  return `${y}-${m}-${d}`;
}


/* =========================================================
   HTML escape
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   줄바꿈
========================================================= */

function formatText(value) {

  return escapeHtml(value)
    .replaceAll("\n", "<br>");
}


/* =========================================================
   로그인 상태 확인
========================================================= */

async function checkAuth() {

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if (error) {

    console.error(error);

    return;

  }

  currentUser =
    data.session?.user || null;

  updateAuthUI();
}


/* =========================================================
   로그인 UI
========================================================= */

function updateAuthUI() {

  if (currentUser) {

    document.body.classList.add(
      "admin-mode"
    );

    document.getElementById(
      "loginButton"
    ).style.display = "none";

    document.getElementById(
      "adminBadge"
    ).style.display = "block";

  } else {

    document.body.classList.remove(
      "admin-mode"
    );

    document.getElementById(
      "loginButton"
    ).style.display = "block";

    document.getElementById(
      "adminBadge"
    ).style.display = "none";

  }

  render();
}


/* =========================================================
   로그인
========================================================= */

async function login() {

  const email =
    document.getElementById(
      "emailInput"
    ).value.trim();

  const password =
    document.getElementById(
      "passwordInput"
    ).value;

  if (!email || !password) {

    alert(
      "이메일과 비밀번호를 입력해주세요."
    );

    return;

  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if (error) {

      throw error;

    }


    currentUser =
      data.user;

    closeLoginModal();

    document.getElementById(
      "passwordInput"
    ).value = "";

    updateAuthUI();

  } catch (error) {

    console.error(error);

    alert(
      "로그인에 실패했습니다.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   로그아웃
========================================================= */

async function logout() {

  const {
    error
  } =
    await supabaseClient.auth.signOut();

  if (error) {

    alert(
      "로그아웃에 실패했습니다.\n" +
      error.message
    );

    return;

  }

  currentUser = null;

  updateAuthUI();

}


/* =========================================================
   Auth 변화 감지
========================================================= */

supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    currentUser =
      session?.user || null;

    updateAuthUI();

  }
);


/* =========================================================
   일정 불러오기
========================================================= */

async function loadEvents() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("events")
      .select("*")
      .order("date", {
        ascending: true
      })
      .order("sort_order", {
        ascending: true
      });


  if (error) {

    console.error(error);

    alert(
      "일정을 불러오지 못했습니다.\n\n" +
      error.message
    );

    return;

  }


  events =
    data || [];

  /*
    기존 sort_order가 없는 예전 데이터도
    날짜별로 자동 정렬 번호를 만들어준다.
  */

  normalizeLocalOrder();

  render();

}


/* =========================================================
   기존 데이터 순서 보정
========================================================= */

function normalizeLocalOrder() {

  const grouped = {};

  events.forEach(event => {

    if (!grouped[event.date]) {

      grouped[event.date] = [];

    }

    grouped[event.date].push(event);

  });


  Object.keys(grouped)
    .forEach(date => {

      grouped[date]
        .sort((a, b) =>
          (a.sort_order ?? 0) -
          (b.sort_order ?? 0)
        );

      grouped[date]
        .forEach((event, index) => {

          event.sort_order =
            index;

        });

    });

}


/* =========================================================
   달력 렌더링
========================================================= */

function render() {

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();


  document.getElementById(
    "year"
  ).textContent =
    year + "년";


  document.getElementById(
    "month"
  ).textContent =
    month + 1;


  renderWeekdays();


  const first =
    new Date(
      year,
      month,
      1
    );

  const last =
    new Date(
      year,
      month + 1,
      0
    );


  /*
    월요일 시작
  */

  const start =
    (first.getDay() + 6) % 7;


  const total =
    Math.ceil(
      (start + last.getDate()) / 7
    ) * 7;


  let html = "";


  for (
    let i = 0;
    i < total;
    i++
  ) {

    const dayNumber =
      i - start + 1;


    const date =
      new Date(
        year,
        month,
        dayNumber
      );


    const inMonth =
      dayNumber >= 1 &&
      dayNumber <= last.getDate();


    const key =
      dateKey(date);


    let classes =
      "day";


    if (!inMonth) {

      classes +=
        " muted";

    }


    if (date.getDay() === 6) {

      classes +=
        " sat";

    }


    if (date.getDay() === 0) {

      classes +=
        " sun";

    }


    const today =
      new Date();


    if (
      date.toDateString() ===
      today.toDateString()
    ) {

      classes +=
        " today";

    }


    const dayEvents =
      events
        .filter(event =>
          event.date === key
        )
        .sort(
          (a, b) =>
            (a.sort_order ?? 0) -
            (b.sort_order ?? 0)
        );


    html += `

      <div
        class="${classes}"
        data-date="${key}"
        onclick="dayClick(event, '${key}')"
      >

        <div class="date">
          ${date.getDate()}
        </div>

        <div class="events">

    `;


    dayEvents.forEach(event => {

      html += `

        <div
          class="event ${escapeHtml(event.color || "gray")}"
          draggable="${currentUser ? "true" : "false"}"
          data-event-id="${event.id}"
          onclick="eventClick(event, '${event.id}')"
        >
          ${formatText(event.title || event.text || "")}
        </div>

      `;

    });


    html += `

        </div>

      </div>

    `;

  }


  document.getElementById(
    "grid"
  ).innerHTML =
    html;


  setupDragAndDrop();

  renderSide();

}


/* =========================================================
   요일
========================================================= */

function renderWeekdays() {

  const names = [
    "월",
    "화",
    "수",
    "목",
    "금",
    "토",
    "일"
  ];


  document.getElementById(
    "weekdays"
  ).innerHTML = names
    .map(
      (name, index) => {

        let cls =
          "weekday";

        if (index === 5) {

          cls += " sat";

        }

        if (index === 6) {

          cls += " sun";

        }

        return `
          <div class="${cls}">
            ${name}
          </div>
        `;

      }
    )
    .join("");

}


/* =========================================================
   날짜 클릭
========================================================= */

function dayClick(
  event,
  date
) {

  /*
    일정 자체를 클릭했을 경우
    여기서 처리하지 않는다.
  */

  if (
    event.target.closest(".event")
  ) {

    return;

  }


  if (!currentUser) {

    return;

  }


  openAddModal(date);

}


/* =========================================================
   일정 클릭
========================================================= */

function eventClick(
  event,
  id
) {

  event.stopPropagation();


  const item =
    events.find(
      x => String(x.id) === String(id)
    );


  if (!item) {

    return;

  }


  if (!currentUser) {

    return;

  }


  /*
    일정 클릭:
    수정할지 삭제할지 선택
  */

  const action =
    confirm(
      `"${(item.title || item.text || "")
        .replaceAll("\n", " ")}"\n\n` +
      "확인 = 수정\n취소 = 삭제"
    );


  if (action) {

    openEditModal(item);

  } else {

    if (
      confirm(
        "정말 삭제할까요?"
      )
    ) {

      deleteEvent(item.id);

    }

  }

}


/* =========================================================
   드래그 앤 드롭
========================================================= */

function setupDragAndDrop() {

  const eventElements =
    document.querySelectorAll(
      ".event"
    );


  eventElements.forEach(el => {

    if (!currentUser) {

      return;

    }


    /* -------------------------
       드래그 시작
    ------------------------- */

    el.addEventListener(
      "dragstart",
      dragStart
    );


    /* -------------------------
       드래그 종료
    ------------------------- */

    el.addEventListener(
      "dragend",
      dragEnd
    );


    /* -------------------------
       다른 일정 위로 이동
    ------------------------- */

    el.addEventListener(
      "dragover",
      dragOver
    );


    /* -------------------------
       드래그해서 들어왔을 때
    ------------------------- */

    el.addEventListener(
      "dragenter",
      dragEnter
    );


    /* -------------------------
       드래그가 빠졌을 때
    ------------------------- */

    el.addEventListener(
      "dragleave",
      dragLeave
    );


    /* -------------------------
       놓기
    ------------------------- */

    el.addEventListener(
      "drop",
      dropEvent
    );

  });

}


/* =========================================================
   drag start
========================================================= */

function dragStart(event) {

  if (!currentUser) {

    event.preventDefault();

    return;

  }


  const id =
    event.currentTarget
      .dataset
      .eventId;


  draggedEventId =
    id;


  event.currentTarget
    .classList
    .add("dragging");


  event.dataTransfer.effectAllowed =
    "move";


  event.dataTransfer.setData(
    "text/plain",
    id
  );

}


/* =========================================================
   drag end
========================================================= */

function dragEnd(event) {

  event.currentTarget
    .classList
    .remove(
      "dragging"
    );


  document
    .querySelectorAll(
      ".event.drag-over"
    )
    .forEach(el =>
      el.classList.remove(
        "drag-over"
      )
    );


  draggedEventId =
    null;

}


/* =========================================================
   drag over
========================================================= */

function dragOver(event) {

  if (!currentUser) {

    return;

  }


  event.preventDefault();

  event.dataTransfer.dropEffect =
    "move";

}


/* =========================================================
   drag enter
========================================================= */

function dragEnter(event) {

  if (!currentUser) {

    return;

  }


  const target =
    event.currentTarget;


  const targetId =
    target.dataset.eventId;


  if (
    String(targetId) ===
    String(draggedEventId)
  ) {

    return;

  }


  const dragged =
    events.find(
      x =>
        String(x.id) ===
        String(draggedEventId)
    );


  const targetEvent =
    events.find(
      x =>
        String(x.id) ===
        String(targetId)
    );


  if (
    !dragged ||
    !targetEvent
  ) {

    return;

  }


  /*
    다른 날짜로 옮기는 건 막는다.

    지금 기능은
    "같은 날짜 안에서 위아래 순서 변경"
    전용이다.
  */

  if (
    dragged.date !==
    targetEvent.date
  ) {

    return;

  }


  target.classList.add(
    "drag-over"
  );

}


/* =========================================================
   drag leave
========================================================= */

function dragLeave(event) {

  event.currentTarget
    .classList.remove(
      "drag-over"
    );

}


/* =========================================================
   drop
========================================================= */

async function dropEvent(event) {

  event.preventDefault();


  if (!currentUser) {

    return;

  }


  const target =
    event.currentTarget;


  target.classList.remove(
    "drag-over"
  );


  const draggedId =
    event.dataTransfer.getData(
      "text/plain"
    ) ||
    draggedEventId;


  const targetId =
    target.dataset.eventId;


  if (
    !draggedId ||
    !targetId ||
    String(draggedId) ===
    String(targetId)
  ) {

    return;

  }


  const dragged =
    events.find(
      x =>
        String(x.id) ===
        String(draggedId)
    );


  const targetEvent =
    events.find(
      x =>
        String(x.id) ===
        String(targetId)
    );


  if (
    !dragged ||
    !targetEvent
  ) {

    return;

  }


  /*
    같은 날짜에서만 순서 변경
  */

  if (
    dragged.date !==
    targetEvent.date
  ) {

    alert(
      "일정 순서는 같은 날짜 안에서만 바꿀 수 있어요."
    );

    return;

  }


  const date =
    dragged.date;


  /*
    해당 날짜 일정만 가져온다.
  */

  let sameDay =
    events
      .filter(
        x => x.date === date
      )
      .sort(
        (a, b) =>
          (a.sort_order ?? 0) -
          (b.sort_order ?? 0)
      );


  const fromIndex =
    sameDay.findIndex(
      x =>
        String(x.id) ===
        String(draggedId)
    );


  const toIndex =
    sameDay.findIndex(
      x =>
        String(x.id) ===
        String(targetId)
    );


  if (
    fromIndex === -1 ||
    toIndex === -1
  ) {

    return;

  }


  /*
    배열에서 실제 순서를 바꾼다.
  */

  const [
    moved
  ] =
    sameDay.splice(
      fromIndex,
      1
    );


  sameDay.splice(
    toIndex,
    0,
    moved
  );


  /*
    화면에서 먼저 순서를 바꿔준다.
  */

  sameDay.forEach(
    (event, index) => {

      event.sort_order =
        index;

    }
  );


  render();


  /*
    Supabase에 저장
  */

  try {

    for (
      const event of sameDay
    ) {

      const {
        error
      } =
        await supabaseClient
          .from("events")
          .update({
            sort_order:
              event.sort_order
          })
          .eq(
            "id",
            event.id
          );


      if (error) {

        throw error;

      }

    }

  } catch (error) {

    console.error(error);

    alert(
      "일정 순서를 저장하지 못했습니다.\n\n" +
      error.message
    );

    /*
      실패하면 서버에서 다시 불러온다.
    */

    await loadEvents();

  }

}


/* =========================================================
   월 이동
========================================================= */

function moveMonth(amount) {

      currentDate.getMonth() + amount,

}

/* =========================================================
   일정 수정 모달
========================================================= */

function openEditModal(

) {

    item.id;


  document.getElementById(
    "eventModalTitle"
  ).textContent =

========================================================= */

function closeEventModal() {

    "eventModal"
  ).style.display =

}


/* =========================================================
   일정 저장
========================================================= */

async function saveEvent() {

  if (!currentUser) {

    alert(
      "관리자 로그인 후 이용해주세요."
    );

    return;

  }


  const date =
    document.getElementById(
      "eventDate"
    ).value;


  const title =
    document.getElementById(
      "eventText"
    ).value.trim();


  const color =
    document.getElementById(
      "eventColor"
    ).value;


  if (!date || !title) {

    alert(
      "날짜와 일정 내용을 입력해주세요."
    );

    return;

  }


  try {

    /*
      -------------------------
      수정
      -------------------------
    */

    if (editingId) {

      const {
        error
      } =
        await supabaseClient
          .from("events")
          .update({
            date: date,
            title: title,
            text: title,
            color: color
          })
          .eq(
            "id",
            editingId
          );


      if (error) {

        throw error;

      }

    }

    /*
      -------------------------
      새 일정
      -------------------------
    */

    else {

      /*
        해당 날짜의 마지막 순서를 찾는다.
      */

      const sameDay =
        events
          .filter(
            x =>
              x.date === date
          );


      const maxOrder =
        sameDay.length
          ? Math.max(
              ...sameDay.map(
                x =>
                  Number(
                    x.sort_order ?? 0
                  )
              )
            )
          : -1;


      const newEvent = {

        date: date,

        title: title,

        text: title,

        color: color,

        sort_order:
          maxOrder + 1

      };


      const {
        error
      } =
        await supabaseClient
          .from("events")
          .insert(
            newEvent
          );


      if (error) {

        throw error;

      }

    }


    closeEventModal();

    await loadEvents();


    const d =
      new Date(
        date + "T12:00:00"
      );


    selectedDate =
      d;


    currentDate =
      new Date(
        d.getFullYear(),
        d.getMonth(),
        1
      );


    render();

  } catch (error) {

    console.error(error);

    alert(
      "일정을 저장하지 못했습니다.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   일정 삭제
========================================================= */

async function deleteEvent(
  id
) {

  if (!currentUser) {

    return;

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("events")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      throw error;

    }


    await loadEvents();

  } catch (error) {

    console.error(error);

    alert(
      "일정을 삭제하지 못했습니다.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   사이드 일정
========================================================= */

function renderSide() {

  document.getElementById(
    "selectedDate"
  ).textContent =
    `${String(
      selectedDate.getMonth() + 1
    ).padStart(2, "0")}.${String(
      selectedDate.getDate()
    ).padStart(2, "0")}`;


  document.getElementById(
    "selectedLabel"
  ).textContent =
    selectedDate.toLocaleDateString(
      "ko-KR",
      {
        weekday: "long"
      }
    );


  const monthKey =
    `${currentDate.getFullYear()}-${String(
      currentDate.getMonth() + 1
    ).padStart(2, "0")}`;


  const list =
    events
      .filter(
        event =>
          event.date.startsWith(
            monthKey
          )
      )
      .sort(
        (a, b) => {

          if (
            a.date !== b.date
          ) {

            return a.date.localeCompare(
              b.date
            );

          }

          return (
            (a.sort_order ?? 0) -
            (b.sort_order ?? 0)
          );

        }
      );


  if (!list.length) {

    document.getElementById(
      "upcoming"
    ).innerHTML =
      `
        <div class="muted">
          등록된 일정이 없어요.
        </div>
      `;

    return;

  }


  document.getElementById(
    "upcoming"
  ).innerHTML =
    list
      .map(
        event => `

          <div class="eventrow">

            <i
              class="dot ${escapeHtml(
                event.color || "gray"
              )}"
            ></i>

            <div>

              <strong>
                ${formatText(
                  event.title ||
                  event.text ||
                  ""
                )}
              </strong>

              <span>
                ${event.date
                  .slice(5)
                  .replace("-", ".")}
              </span>

            </div>

          </div>

        `
      )
      .join("");

}
