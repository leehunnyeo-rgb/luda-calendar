<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루다의 캘린더</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --purple: #7c5cff;
    --purple-dark: #6046d9;
    --purple-light: #eee9ff;
    --purple-soft: #f7f4ff;
    --text: #302b3d;
    --muted: #8d879b;
    --line: #eeeaf5;
    --white: #ffffff;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 10% 0%, rgba(150,125,255,.20), transparent 32%),
        radial-gradient(circle at 100% 10%, rgba(220,190,255,.22), transparent 30%),
        linear-gradient(135deg, #f8f6ff 0%, #f2efff 45%, #faf9ff 100%);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .6;
}

/* ==============================
   전체
============================== */

.container {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
    padding: 34px 0 50px;
}

/* ==============================
   상단
============================== */

.top-card {
    position: relative;
    overflow: hidden;
    margin-bottom: 22px;
    padding: 28px 30px;
    border-radius: 28px;
    background:
        linear-gradient(135deg, #7154ed 0%, #9279ff 48%, #b59dff 100%);
    color: white;
    box-shadow:
        0 18px 45px rgba(103, 75, 205, .22);
}

.top-card::before {
    content: "";
    position: absolute;
    width: 260px;
    height: 260px;
    right: -80px;
    top: -130px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
}

.top-card::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    right: 130px;
    bottom: -120px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
}

.top-content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand h1 {
    margin: 0;
    font-size: 31px;
    font-weight: 850;
    letter-spacing: -1.2px;
}

.brand p {
    margin: 7px 0 0;
    font-size: 14px;
    color: rgba(255,255,255,.82);
}

.auth-area {
    display: flex;
    align-items: center;
    gap: 9px;
}

.auth-status {
    font-size: 13px;
    color: rgba(255,255,255,.86);
}

.btn {
    border: 0;
    border-radius: 12px;
    padding: 10px 15px;
    font-weight: 750;
    transition:
        transform .15s,
        box-shadow .15s,
        background .15s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-white {
    background: white;
    color: #654bdd;
    box-shadow: 0 5px 16px rgba(60,40,130,.12);
}

.btn-white:hover {
    background: #faf9ff;
}

.btn-light {
    background: #f0ecff;
    color: #684fe0;
}

.btn-purple {
    background: linear-gradient(135deg, #7657ed, #9275ff);
    color: white;
    box-shadow: 0 7px 18px rgba(112,82,226,.24);
}

.btn-danger {
    background: #ffe8ed;
    color: #d63e5b;
}

.btn-small {
    padding: 8px 12px;
    font-size: 12px;
}

/* ==============================
   안내
============================== */

.info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding: 13px 17px;
    border: 1px solid rgba(124,92,255,.08);
    border-radius: 15px;
    background: rgba(255,255,255,.78);
    box-shadow: 0 5px 20px rgba(83,63,145,.05);
    backdrop-filter: blur(10px);
}

.permission {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--muted);
    font-size: 13px;
}

.permission-dot {
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #b9b3c8;
}

.permission-dot.admin {
    background: #7c5cff;
    box-shadow: 0 0 0 4px rgba(124,92,255,.12);
}

/* ==============================
   에러
============================== */

.error-message {
    display: none;
    margin-bottom: 14px;
    padding: 13px 16px;
    border: 1px solid #ffd0d8;
    border-radius: 13px;
    background: #fff1f3;
    color: #b72f48;
    font-size: 13px;
    white-space: pre-wrap;
}

.error-message.show {
    display: block;
}

/* ==============================
   캘린더 카드
============================== */

.calendar-card {
    overflow: hidden;
    border: 1px solid rgba(110,84,200,.08);
    border-radius: 25px;
    background: rgba(255,255,255,.94);
    box-shadow:
        0 18px 55px rgba(70,51,135,.10),
        0 3px 10px rgba(70,51,135,.04);
}

/* 달력 헤더 */

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 21px 24px;
    background: linear-gradient(
        180deg,
        #ffffff 0%,
        #fbfaff 100%
    );
    border-bottom: 1px solid var(--line);
}

.month-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.calendar-icon {
    width: 43px;
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: var(--purple-light);
    color: var(--purple);
    font-size: 21px;
}

.month-title {
    font-size: 23px;
    font-weight: 850;
    letter-spacing: -0.7px;
}

.month-sub {
    margin-top: 2px;
    color: var(--muted);
    font-size: 11px;
}

.month-controls {
    display: flex;
    gap: 7px;
}

.month-btn {
    width: 38px;
    height: 38px;
    border: 1px solid #e9e4f3;
    border-radius: 11px;
    background: white;
    color: #766d85;
    font-size: 21px;
    line-height: 1;
    transition: .15s;
}

.month-btn:hover {
    border-color: #cfc4ef;
    background: #f7f4ff;
    color: var(--purple);
}

/* ==============================
   요일
   월 화 수 목 금 토 일
============================== */

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--line);
    background: #faf9fd;
}

.weekday {
    padding: 12px 5px;
    text-align: center;
    color: #8b8498;
    font-size: 12px;
    font-weight: 800;
}

/* 토요일 파랑 */
.weekday:nth-child(6) {
    color: #6c8bd8;
}

/* 일요일 빨강 */
.weekday:nth-child(7) {
    color: #ef6b83;
}

/* ==============================
   날짜
============================== */

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
}

.day {
    position: relative;
    min-height: 142px;
    padding: 9px;
    overflow: hidden;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: white;
    transition: background .15s;
}

.day:nth-child(7n) {
    border-right: 0;
}

.day.empty {
    background: #fcfbfe;
}

.day.addable {
    cursor: pointer;
}

.day.addable:hover {
    background: #faf8ff;
}

.day-number {
    position: relative;
    z-index: 10;
    width: 27px;
    height: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #5f586b;
    font-size: 12px;
    font-weight: 800;
}

.day.sunday .day-number {
    color: #ec6a81;
}

.day.saturday .day-number {
    color: #6686d5;
}

.day.today .day-number {
    background: linear-gradient(135deg, #7556ed, #967aff);
    color: white;
    box-shadow: 0 4px 10px rgba(117,86,237,.27);
}

/* ==============================
   일정
============================== */

.events {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 5px;
}

.event {
    position: relative;
    min-height: 28px;
    padding: 6px 8px;
    overflow: hidden;
    border-radius: 8px;
    background: #f2f0f5;
    color: #5e5869;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
    cursor: pointer;
    transition: transform .12s, filter .12s;
}

.event:hover {
    transform: translateY(-1px);
    filter: brightness(.97);
}

/* 색상 */

.event-gray {
    background: #e2e0e6;
    color: #5e5965;
}

.event-green {
    background: #c9edcf;
    color: #286037;
}

.event-yellow {
    background: #ffe9a1;
    color: #6b5900;
}

.event-purple {
    background: #d9ccff;
    color: #5940a2;
}

/* ==============================
   일정 하나 = 날짜 전체 색상
============================== */

.day.single-event {
    padding: 0;
}

.day.single-event .day-number {
    position: absolute;
    top: 9px;
    left: 9px;
    z-index: 20;
}

.day.single-event .events {
    position: absolute;
    inset: 0;
    margin: 0;
    z-index: 2;
}

.day.single-event .event {
    width: 100%;
    height: 100%;
    min-height: 100%;
    margin: 0;
    padding: 43px 13px 12px;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

/* 색상 없음은 전체 칠하지 않음 */

.day.single-event.no-color-event {
    padding: 9px;
}

.day.single-event.no-color-event .day-number {
    position: relative;
    top: auto;
    left: auto;
}

.day.single-event.no-color-event .events {
    position: relative;
    inset: auto;
    margin-top: 5px;
}

.day.single-event.no-color-event .event {
    height: auto;
    min-height: 28px;
    padding: 6px 8px;
    border-radius: 8px;
    display: block;
    text-align: left;
}

/* ==============================
   로딩
============================== */

.loading {
    grid-column: 1 / -1;
    padding: 70px 20px;
    text-align: center;
    color: #aaa3b4;
}

/* ==============================
   모달
============================== */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(42,32,70,.42);
    backdrop-filter: blur(5px);
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 430px;
    padding: 25px;
    border: 1px solid rgba(124,92,255,.12);
    border-radius: 22px;
    background: white;
    box-shadow:
        0 25px 80px rgba(40,25,90,.22);
    animation: modalIn .18s ease-out;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.modal h2 {
    margin: 0;
    font-size: 21px;
    font-weight: 850;
}

.modal-close {
    width: 33px;
    height: 33px;
    border: 0;
    border-radius: 9px;
    background: #f4f1fa;
    color: #82798e;
    font-size: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #655e70;
    font-size: 12px;
    font-weight: 800;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px 13px;
    outline: none;
    border: 1px solid #e4dfeb;
    border-radius: 11px;
    background: #fcfbfe;
    color: #3f3949;
    transition: .15s;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #a896e9;
    background: white;
    box-shadow: 0 0 0 4px rgba(124,92,255,.08);
}

.modal-buttons {
    display: flex;
    gap: 8px;
    margin-top: 21px;
}

.modal-buttons button {
    flex: 1;
}

/* ==============================
   반응형
============================== */

@media (max-width: 760px) {

    .container {
        width: calc(100% - 16px);
        padding-top: 12px;
    }

    .top-card {
        padding: 21px 18px;
        border-radius: 22px;
    }

    .top-content {
        align-items: flex-start;
    }

    .brand h1 {
        font-size: 24px;
    }

    .brand p {
        font-size: 12px;
    }

    .auth-status {
        display: none;
    }

    .calendar-card {
        border-radius: 18px;
    }

    .calendar-header {
        padding: 14px;
    }

    .calendar-icon {
        width: 36px;
        height: 36px;
        font-size: 17px;
    }

    .month-title {
        font-size: 18px;
    }

    .month-sub {
        display: none;
    }

    .month-btn {
        width: 34px;
        height: 34px;
    }

    .day {
        min-height: 94px;
        padding: 5px;
    }

    .day-number {
        width: 23px;
        height: 23px;
        font-size: 10px;
    }

    .event {
        min-height: 24px;
        padding: 4px 5px;
        border-radius: 6px;
        font-size: 9px;
    }

    .day.single-event .day-number {
        top: 6px;
        left: 6px;
    }

    .day.single-event .event {
        padding: 34px 5px 5px;
        font-size: 10px;
    }

    .day.single-event.no-color-event {
        padding: 5px;
    }

    .day.single-event.no-color-event .event {
        padding: 4px 5px;
    }

    .weekday {
        padding: 9px 2px;
        font-size: 10px;
    }

    .info-bar {
        padding: 10px 12px;
    }

    .permission {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 상단 -->

    <div class="top-card">

        <div class="top-content">

            <div class="brand">
                <h1>루다의 캘린더</h1>

                <p id="description">
                    일정을 확인할 수 있습니다.
                </p>
            </div>

            <div class="auth-area">

                <span
                    class="auth-status"
                    id="authStatus"
                >
                    확인 중...
                </span>

                <button
                    class="btn btn-white btn-small"
                    id="loginButton"
                    onclick="openLoginModal()"
                >
                    관리자 로그인
                </button>

                <button
                    class="btn btn-light btn-small"
                    id="logoutButton"
                    onclick="logout()"
                    style="display:none;"
                >
                    로그아웃
                </button>

            </div>

        </div>

    </div>


    <!-- 오류 -->

    <div
        class="error-message"
        id="errorMessage"
    ></div>


    <!-- 안내 -->

    <div class="info-bar">

        <div class="permission">

            <span
                class="permission-dot"
                id="permissionDot"
            ></span>

            <span id="permissionText">
                일정을 불러오는 중...
            </span>

        </div>

        <button
            class="btn btn-light btn-small"
            onclick="goToday()"
        >
            오늘
        </button>

    </div>


    <!-- 캘린더 -->

    <div class="calendar-card">

        <div class="calendar-header">

            <div class="month-area">

                <div class="calendar-icon">
                    📅
                </div>

                <div>

                    <div
                        class="month-title"
                        id="monthTitle"
                    ></div>

                    <div class="month-sub">
                        Luda Calendar
                    </div>

                </div>

            </div>

            <div class="month-controls">

                <button
                    class="month-btn"
                    onclick="changeMonth(-1)"
                >
                    ‹
                </button>

                <button
                    class="month-btn"
                    onclick="changeMonth(1)"
                >
                    ›
                </button>

            </div>

        </div>


        <!-- 월요일 시작 -->

        <div class="weekdays">

            <div class="weekday">월</div>
            <div class="weekday">화</div>
            <div class="weekday">수</div>
            <div class="weekday">목</div>
            <div class="weekday">금</div>
            <div class="weekday">토</div>
            <div class="weekday">일</div>

        </div>


        <div
            class="calendar-grid"
            id="calendarGrid"
        >

            <div class="loading">
                캘린더를 불러오는 중...
            </div>

        </div>

    </div>

</div>


<!-- 로그인 모달 -->

<div
    class="modal-overlay"
    id="loginModal"
    onclick="closeModalByBackground(event, 'loginModal')"
>

    <div class="modal">

        <div class="modal-head">

            <h2>관리자 로그인</h2>

            <button
                class="modal-close"
                onclick="closeLoginModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label for="emailInput">
                이메일
            </label>

            <input
                id="emailInput"
                type="email"
                autocomplete="email"
                placeholder="관리자 이메일"
            >

        </div>


        <div class="form-group">

            <label for="passwordInput">
                비밀번호
            </label>

            <input
                id="passwordInput"
                type="password"
                autocomplete="current-password"
                placeholder="비밀번호"
            >

        </div>


        <div class="modal-buttons">

            <button
                class="btn btn-light"
                onclick="closeLoginModal()"
            >
                취소
            </button>

            <button
                class="btn btn-purple"
                id="loginSubmitButton"
                onclick="login()"
            >
                로그인
            </button>

        </div>

    </div>

</div>


<!-- 일정 모달 -->

<div
    class="modal-overlay"
    id="eventModal"
    onclick="closeModalByBackground(event, 'eventModal')"
>

    <div class="modal">

        <div class="modal-head">

            <h2 id="eventModalTitle">
                일정 추가
            </h2>

            <button
                class="modal-close"
                onclick="closeEventModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label for="dateInput">
                날짜
            </label>

            <input
                id="dateInput"
                type="date"
            >

        </div>


        <div class="form-group">

            <label for="titleInput">
                일정
            </label>

            <input
                id="titleInput"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="일정 내용을 입력하세요"
            >

        </div>


        <div class="form-group">

            <label for="colorInput">
                색상
            </label>

            <select id="colorInput">

                <option value="">
                    색상 없음
                </option>

                <option value="gray">
                    회색
                </option>

                <option value="green">
                    초록
                </option>

                <option value="yellow">
                    노랑
                </option>

                <option value="purple">
                    보라
                </option>

            </select>

        </div>


        <div class="modal-buttons">

            <button
                class="btn btn-light"
                onclick="closeEventModal()"
            >
                취소
            </button>

            <button
                class="btn btn-danger"
                id="deleteButton"
                onclick="deleteEvent()"
                style="display:none;"
            >
                삭제
            </button>

            <button
                class="btn btn-purple"
                id="saveButton"
                onclick="saveEvent()"
            >
                저장
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://invachujoiisrbhkzhzc.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_1-PfSu1n9AE0PdTKTQExFA_tIsfTJmZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   상태
========================================================= */

let currentDate = new Date();

let events = [];

let isAdmin = false;

let currentUser = null;

let editingEventId = null;


/* =========================================================
   DOM
========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   오류
========================================================= */

function showError(message) {

    const box = $("errorMessage");

    box.textContent = message;

    box.classList.add("show");

    console.error(message);
}


function clearError() {

    const box = $("errorMessage");

    box.textContent = "";

    box.classList.remove("show");
}


/* =========================================================
   날짜
========================================================= */

function formatDate(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function getEventsForDate(dateString) {

    return events.filter(
        event =>
            event.date === dateString
    );
}


/* =========================================================
   인증
========================================================= */

async function checkAuth() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();

        if (error) {
            throw error;
        }

        currentUser =
            data.session
                ? data.session.user
                : null;

        isAdmin =
            !!currentUser;

        updateAuthUI();

    } catch (error) {

        currentUser = null;

        isAdmin = false;

        updateAuthUI();

        showError(
            "로그인 상태를 확인하지 못했습니다.\n" +
            error.message
        );
    }
}


/* =========================================================
   인증 UI
========================================================= */

function updateAuthUI() {

    if (isAdmin) {

        $("authStatus").textContent =
            "관리자 로그인됨";

        $("loginButton").style.display =
            "none";

        $("logoutButton").style.display =
            "inline-block";

        $("permissionText").textContent =
            "관리자 모드 · 날짜를 클릭해서 일정을 추가하거나 수정할 수 있습니다.";

        $("permissionDot").classList.add(
            "admin"
        );

        $("description").textContent =
            "관리자 모드로 일정을 관리할 수 있습니다.";

    } else {

        $("authStatus").textContent =
            "방문자";

        $("loginButton").style.display =
            "inline-block";

        $("logoutButton").style.display =
            "none";

        $("permissionText").textContent =
            "일정 보기만 가능합니다. 추가·수정·삭제는 관리자 로그인 후 가능합니다.";

        $("permissionDot").classList.remove(
            "admin"
        );

        $("description").textContent =
            "일정을 확인할 수 있습니다.";
    }

    renderCalendar();
}


/* =========================================================
   로그인
========================================================= */

function openLoginModal() {

    clearError();

    $("loginModal").classList.add(
        "show"
    );

    setTimeout(
        () =>
            $("emailInput").focus(),
        100
    );
}


function closeLoginModal() {

    $("loginModal").classList.remove(
        "show"
    );
}


async function login() {

    clearError();

    const email =
        $("emailInput").value.trim();

    const password =
        $("passwordInput").value;

    if (!email || !password) {

        showError(
            "이메일과 비밀번호를 입력해주세요."
        );

        return;
    }

    const button =
        $("loginSubmitButton");

    button.disabled = true;

    button.textContent =
        "로그인 중...";

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            throw error;
        }

        currentUser =
            data.user;

        isAdmin = true;

        updateAuthUI();

        closeLoginModal();

        $("passwordInput").value = "";

    } catch (error) {

        showError(
            "로그인에 실패했습니다.\n\n" +
            error.message
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "로그인";
    }
}


/* =========================================================
   로그아웃
========================================================= */

async function logout() {

    clearError();

    const {
        error
    } =
    await supabaseClient.auth.signOut();

    if (error) {

        showError(
            "로그아웃에 실패했습니다.\n" +
            error.message
        );

        return;
    }

    currentUser = null;

    isAdmin = false;

    closeEventModal();

    updateAuthUI();
}


/* =========================================================
   Auth 변화
========================================================= */

supabaseClient.auth.onAuthStateChange(
    (_event, session) => {

        currentUser =
            session
                ? session.user
                : null;

        isAdmin =
            !!session;

        updateAuthUI();
    }
);


/* =========================================================
   일정 불러오기
========================================================= */

async function loadEvents() {

    clearError();

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("events")
            .select("*")
            .order(
                "date",
                {
                    ascending: true
                }
            );

        if (error) {
            throw error;
        }

        events =
            data || [];

        renderCalendar();

    } catch (error) {

        events = [];

        renderCalendar();

        showError(
            "일정을 불러오지 못했습니다.\n\n" +
            error.message
        );
    }
}


/* =========================================================
   캘린더 렌더링
   ★ 월요일 시작
========================================================= */

function renderCalendar() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const monthNames = [
        "1월",
        "2월",
        "3월",
        "4월",
        "5월",
        "6월",
        "7월",
        "8월",
        "9월",
        "10월",
        "11월",
        "12월"
    ];

    $("monthTitle").textContent =
        `${year}년 ${monthNames[month]}`;

    const grid =
        $("calendarGrid");

    grid.innerHTML = "";

    /*
       JavaScript getDay():

       일요일 = 0
       월요일 = 1
       화요일 = 2
       ...
       토요일 = 6

       우리는 월요일을 첫 번째 칸으로 사용하므로
       월요일 = 0
       화요일 = 1
       ...
       일요일 = 6
    */

    const firstDay =
        (
            new Date(
                year,
                month,
                1
            ).getDay() + 6
        ) % 7;

    const lastDate =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /* 이전 달 빈칸 */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        grid.appendChild(
            empty
        );
    }


    const todayString =
        formatDate(
            new Date()
        );


    /* 날짜 */

    for (
        let dayNumber = 1;
        dayNumber <= lastDate;
        dayNumber++
    ) {

        const date =
            new Date(
                year,
                month,
                dayNumber
            );

        const dateString =
            formatDate(date);

        const dayEvents =
            getEventsForDate(
                dateString
            );

        const dayEl =
            document.createElement("div");

        dayEl.className =
            "day";


        /* 오늘 */

        if (
            dateString ===
            todayString
        ) {
            dayEl.classList.add(
                "today"
            );
        }


        /* 주말 */

        if (
            date.getDay() === 0
        ) {
            dayEl.classList.add(
                "sunday"
            );
        }

        if (
            date.getDay() === 6
        ) {
            dayEl.classList.add(
                "saturday"
            );
        }


        if (isAdmin) {

            dayEl.classList.add(
                "addable"
            );
        }


        /* 날짜 번호 */

        const numberEl =
            document.createElement("div");

        numberEl.className =
            "day-number";

        numberEl.textContent =
            dayNumber;

        dayEl.appendChild(
            numberEl
        );


        /* 일정 영역 */

        const eventsEl =
            document.createElement("div");

        eventsEl.className =
            "events";


        /* 일정이 하나인 경우 */

        if (
            dayEvents.length === 1
        ) {

            if (
                dayEvents[0].color
            ) {

                dayEl.classList.add(
                    "single-event"
                );

            } else {

                dayEl.classList.add(
                    "single-event",
                    "no-color-event"
                );
            }
        }


        /* 일정 */

        dayEvents.forEach(
            event => {

                const eventEl =
                    document.createElement(
                        "div"
                    );

                eventEl.className =
                    "event";


                if (event.color) {

                    eventEl.classList.add(
                        `event-${event.color}`
                    );
                }


                eventEl.textContent =
                    event.title;


                if (isAdmin) {

                    eventEl.addEventListener(
                        "click",
                        function(e) {

                            e.stopPropagation();

                            openEditModal(
                                event
                            );
                        }
                    );
                }


                eventsEl.appendChild(
                    eventEl
                );
            }
        );


        dayEl.appendChild(
            eventsEl
        );


        /* 날짜 클릭 */

        dayEl.addEventListener(
            "click",
            function() {

                if (!isAdmin) {
                    return;
                }


                if (
                    dayEvents.length > 0
                ) {

                    openEditModal(
                        dayEvents[0]
                    );

                } else {

                    openAddModal(
                        dateString
                    );
                }
            }
        );


        grid.appendChild(
            dayEl
        );
    }
}


/* =========================================================
   월 이동
========================================================= */

function changeMonth(amount) {

    currentDate =
        new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + amount,
            1
        );

    renderCalendar();
}


function goToday() {

    const now =
        new Date();

    currentDate =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            1
        );

    renderCalendar();
}


/* =========================================================
   일정 추가
========================================================= */

function openAddModal(dateString) {

    if (!isAdmin) {
        return;
    }

    clearError();

    editingEventId = null;

    $("eventModalTitle").textContent =
        "일정 추가";

    $("dateInput").value =
        dateString;

    $("titleInput").value =
        "";

    /* 기본값 = 색상 없음 */

    $("colorInput").value =
        "";

    $("deleteButton").style.display =
        "none";

    $("saveButton").textContent =
        "저장";

    $("eventModal").classList.add(
        "show"
    );

    setTimeout(
        () =>
            $("titleInput").focus(),
        100
    );
}


/* =========================================================
   일정 수정
========================================================= */

function openEditModal(event) {

    if (!isAdmin) {
        return;
    }

    clearError();

    editingEventId =
        event.id;

    $("eventModalTitle").textContent =
        "일정 수정";

    $("dateInput").value =
        event.date;

    $("titleInput").value =
        event.title;

    $("colorInput").value =
        event.color || "";

    $("deleteButton").style.display =
        "block";

    $("saveButton").textContent =
        "저장";

    $("eventModal").classList.add(
        "show"
    );

    setTimeout(
        () => {

            $("titleInput").focus();

            $("titleInput").select();

        },
        100
    );
}


/* =========================================================
   일정 모달 닫기
========================================================= */

function closeEventModal() {

    $("eventModal").classList.remove(
        "show"
    );

    editingEventId = null;
}


/* =========================================================
   일정 저장
========================================================= */

async function saveEvent() {

    if (!isAdmin) {

        showError(
            "관리자 로그인 후 사용할 수 있습니다."
        );

        return;
    }

    clearError();

    const date =
        $("dateInput").value;

    const title =
        $("titleInput").value.trim();

    const color =
        $("colorInput").value;


    if (!date) {

        showError(
            "날짜를 선택해주세요."
        );

        return;
    }

    if (!title) {

        showError(
            "일정 내용을 입력해주세요."
        );

        $("titleInput").focus();

        return;
    }


    const button =
        $("saveButton");

    button.disabled = true;

    button.textContent =
        "저장 중...";


    try {

        let result;


        /* 수정 */

        if (editingEventId) {

            result =
                await supabaseClient
                    .from("events")
                    .update({
                        date: date,
                        title: title,
                        color: color
                    })
                    .eq(
                        "id",
                        editingEventId
                    )
                    .select()
                    .single();


        /* 추가 */

        } else {

            result =
                await supabaseClient
                    .from("events")
                    .insert({
                        id: crypto.randomUUID(),
                        date: date,
                        title: title,
                        color: color
                    })
                    .select()
                    .single();
        }


        if (result.error) {
            throw result.error;
        }


        /* 화면 데이터 업데이트 */

        if (editingEventId) {

            const index =
                events.findIndex(
                    event =>
                        event.id ===
                        editingEventId
                );

            if (index !== -1) {

                events[index] =
                    result.data;
            }

        } else {

            events.push(
                result.data
            );
        }


        closeEventModal();

        renderCalendar();


    } catch (error) {

        showError(
            "일정 저장에 실패했습니다.\n\n" +
            error.message
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "저장";
    }
}


/* =========================================================
   삭제
========================================================= */

async function deleteEvent() {

    if (
        !isAdmin ||
        !editingEventId
    ) {
        return;
    }


    const event =
        events.find(
            item =>
                item.id ===
                editingEventId
        );


    if (!event) {
        return;
    }


    if (
        !confirm(
            `"${event.title}" 일정을 삭제할까요?`
        )
    ) {
        return;
    }


    clearError();

    const button =
        $("deleteButton");

    button.disabled = true;

    button.textContent =
        "삭제 중...";


    try {

        const {
            error
        } =
        await supabaseClient
            .from("events")
            .delete()
            .eq(
                "id",
                editingEventId
            );


        if (error) {
            throw error;
        }


        events =
            events.filter(
                item =>
                    item.id !==
                    editingEventId
            );


        closeEventModal();

        renderCalendar();


    } catch (error) {

        showError(
            "일정 삭제에 실패했습니다.\n\n" +
            error.message
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "삭제";
    }
}


/* =========================================================
   Enter 저장
========================================================= */

$("titleInput").addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            saveEvent();
        }
    }
);


/* 로그인창 Enter */

$("passwordInput").addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            login();
        }
    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Escape"
        ) {
            return;
        }

        closeLoginModal();

        closeEventModal();
    }
);


/* =========================================================
   모달 바깥 클릭
========================================================= */

function closeModalByBackground(
    event,
    modalId
) {

    if (
        event.target.id !== modalId
    ) {
        return;
    }


    if (
        modalId ===
        "loginModal"
    ) {

        closeLoginModal();

    } else {

        closeEventModal();
    }
}


/* =========================================================
   시작
========================================================= */

async function init() {

    await checkAuth();

    await loadEvents();
}

init();

</script>
