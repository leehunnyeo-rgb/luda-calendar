<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루다의 캘린더</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
      background:
        linear-gradient(135deg, #eee7ff 0%, #f8f5ff 45%, #f0ecff 100%);
      color: #333;
      padding: 30px 15px 50px;
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    /* 상단 */
    .top-card {
      background: linear-gradient(135deg, #8d6bea, #6f55d9);
      color: white;
      border-radius: 24px;
      padding: 28px 30px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(105, 76, 190, 0.22);
    }

    .top-card h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    .top-card p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .info-bar {
      background: rgba(255,255,255,0.9);
      border-radius: 16px;
      padding: 13px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 5px 18px rgba(80,60,120,0.08);
      flex-wrap: wrap;
    }

    .login-status {
      font-size: 13px;
      color: #777;
    }

    .login-btn {
      border: 0;
      background: #7659df;
      color: white;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .login-btn:hover {
      background: #6548ce;
    }

    /* 캘린더 */
    .calendar-card {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 12px 35px rgba(80,60,120,0.10);
      overflow: hidden;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .month-title {
      font-size: 23px;
      font-weight: 800;
      color: #4b3c73;
    }

    .calendar-buttons {
      display: flex;
      gap: 7px;
    }

    .calendar-buttons button {
      border: 0;
      background: #f1edff;
      color: #6650a5;
      width: 38px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    .calendar-buttons button:hover {
      background: #e4dcff;
    }

    .today-btn {
      width: auto !important;
      padding: 0 13px;
      font-size: 13px !important;
    }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #eee;
    }

    .weekday {
      text-align: center;
      padding: 10px 3px;
      font-size: 13px;
      font-weight: 700;
      color: #777;
    }

    .weekday.saturday {
      color: #6384d8;
    }

    .weekday.sunday {
      color: #e56b83;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid #eee;
      border-top: 1px solid #eee;
      user-select: none;
    }

    .calendar-grid.dragging {
      cursor: crosshair;
    }

    .empty-cell {
      min-height: 125px;
      background: #fafafa;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .day {
      min-height: 125px;
      position: relative;
      padding: 8px;
      border-right: 1px solid #eee;
      border-bottom: 1px solid #eee;
      background: white;
      cursor: default;
      transition: background 0.1s ease;
      overflow: hidden;
    }

    .day.admin-day {
      cursor: crosshair;
    }

    .day:hover {
      background: #faf8ff;
    }

    .day.today {
      box-shadow: inset 0 0 0 2px #8b6de8;
    }

    .day-number {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      color: #555;
      margin-bottom: 5px;
      position: relative;
      z-index: 4;
    }

    .day.saturday .day-number {
      color: #5f7fd0;
    }

    .day.sunday .day-number {
      color: #df6179;
    }

    .day.today .day-number {
      background: #7c60dc;
      color: white;
    }

    /*
      색상 일정
      --------------------
      색상이 있는 일정이 하나라도 있으면
      해당 날짜 칸 전체를 색칠한다.
    */
    .day.colored-gray {
      background: #e9e9ed;
    }

    .day.colored-green {
      background: #d9f1df;
    }

    .day.colored-yellow {
      background: #fff1b8;
    }

    .day.colored-purple {
      background: #e8ddff;
    }

    .day.colored-gray:hover {
      background: #e4e4e8;
    }

    .day.colored-green:hover {
      background: #d0ebd7;
    }

    .day.colored-yellow:hover {
      background: #ffecaa;
    }

    .day.colored-purple:hover {
      background: #dfd2fa;
    }

    .events {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      z-index: 3;
    }

    .event {
      border-radius: 7px;
      padding: 5px 7px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
      word-break: break-word;
      white-space: pre-line;
      cursor: pointer;
    }

    .event.no-color {
      background: #f3f1f7;
      color: #4e485c;
      border: 1px solid #e2dfea;
    }

    .event.color-gray {
      background: rgba(120,120,130,0.20);
      color: #4e4e55;
    }

    .event.color-green {
      background: rgba(72,160,94,0.18);
      color: #317340;
    }

    .event.color-yellow {
      background: rgba(235,183,44,0.22);
      color: #866817;
    }

    .event.color-purple {
      background: rgba(126,91,210,0.18);
      color: #6843a7;
    }

    /*
      드래그 선택 영역
    */
    .day.drag-selected {
      background: #dcd1ff !important;
      box-shadow: inset 0 0 0 2px #8567e5;
    }

    .day.drag-selected .day-number {
      background: #8062df;
      color: white;
    }

    .day.drag-anchor {
      box-shadow: inset 0 0 0 3px #6848d0;
    }

    .dragging-hint {
      display: none;
      position: fixed;
      z-index: 100;
      pointer-events: none;
      background: rgba(70, 53, 125, 0.94);
      color: white;
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .calendar-grid.dragging + .dragging-hint {
      display: block;
    }

    /* 에러 */
    .error-box {
      display: none;
      background: #fff0f2;
      color: #c44961;
      border: 1px solid #ffd0d8;
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    /* 모달 */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 20, 50, 0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: min(440px, 100%);
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(40,25,70,0.25);
    }

    .modal h2 {
      margin: 0 0 18px;
      font-size: 21px;
      color: #4d3d72;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #625b6e;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      border: 1px solid #ddd7e7;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #8568dc;
      box-shadow: 0 0 0 3px rgba(133,104,220,0.10);
    }

    .range-info {
      background: #f4f0ff;
      border: 1px solid #e4dcff;
      border-radius: 11px;
      padding: 11px 13px;
      color: #644fa4;
      font-size: 13px;
      line-height: 1.5;
    }

    .range-info strong {
      color: #4e3a88;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .modal-buttons button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .cancel-btn {
      background: #f1eff4;
      color: #68636f;
    }

    .save-btn {
      background: #7659df;
      color: white;
    }

    .delete-btn {
      margin-right: auto;
      background: #fff0f2;
      color: #d05268;
    }

    /* 로그인 */
    .login-modal .modal {
      width: min(390px, 100%);
    }

    .login-message {
      font-size: 13px;
      color: #777;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    /* 모바일 */
    @media (max-width: 700px) {
      body {
        padding: 15px 8px 35px;
      }

      .top-card {
        padding: 22px 20px;
        border-radius: 18px;
      }

      .top-card h1 {
        font-size: 23px;
      }

      .calendar-card {
        padding: 10px;
        border-radius: 18px;
      }

      .calendar-header {
        padding: 6px 4px;
      }

      .month-title {
        font-size: 18px;
      }

      .weekday {
        font-size: 11px;
        padding: 8px 1px;
      }

      .day,
      .empty-cell {
        min-height: 92px;
      }

      .day {
        padding: 5px;
      }

      .day-number {
        width: 23px;
        height: 23px;
        font-size: 11px;
      }

      .event {
        font-size: 10px;
        padding: 4px 5px;
        border-radius: 5px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top-card">
    <h1>루다의 캘린더</h1>
    <p>일정을 한눈에 확인해보세요 ✨</p>
  </div>

  <div class="info-bar">
    <div class="login-status" id="loginStatus">
      공개 캘린더 · 누구나 일정 확인 가능
    </div>

    <button class="login-btn" id="loginButton" onclick="openLoginModal()">
      관리자 로그인
    </button>
  </div>

  <div id="errorBox" class="error-box"></div>

  <div class="calendar-card">

    <div class="calendar-header">
      <div class="month-title" id="monthTitle"></div>

      <div class="calendar-buttons">
        <button onclick="changeMonth(-1)">‹</button>
        <button class="today-btn" onclick="goToday()">오늘</button>
        <button onclick="changeMonth(1)">›</button>
      </div>
    </div>

    <div class="weekday-row">
      <div class="weekday">월</div>
      <div class="weekday">화</div>
      <div class="weekday">수</div>
      <div class="weekday">목</div>
      <div class="weekday">금</div>
      <div class="weekday saturday">토</div>
      <div class="weekday sunday">일</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

  </div>
</div>

<!-- 일정 추가/수정 모달 -->
<div class="modal-bg" id="eventModalBg" onclick="closeModalByBackground(event)">

  <div class="modal">

    <h2 id="eventModalTitle">일정 추가</h2>

    <div class="form-group" id="singleDateGroup">
      <label>날짜</label>
      <input type="date" id="dateInput">
    </div>

    <div class="form-group" id="rangeDateGroup" style="display:none;">
      <label>선택한 날짜</label>
      <div class="range-info" id="rangeInfo"></div>
    </div>

    <div class="form-group">
      <label>일정</label>
      <input
        type="text"
        id="titleInput"
        placeholder="일정 내용을 입력하세요"
        autocomplete="off"
      >
    </div>

    <div class="form-group">
      <label>색상</label>

      <select id="colorInput">
        <option value="">색상 없음</option>
        <option value="gray">회색</option>
        <option value="green">초록색</option>
        <option value="yellow">노란색</option>
        <option value="purple">보라색</option>
      </select>
    </div>

    <div class="modal-buttons">

      <button
        class="delete-btn"
        id="deleteButton"
        onclick="deleteEvent()"
        style="display:none;"
      >
        삭제
      </button>

      <button
        class="cancel-btn"
        onclick="closeEventModal()"
      >
        취소
      </button>

      <button
        class="save-btn"
        onclick="saveEvent()"
      >
        저장
      </button>

    </div>
  </div>
</div>

<!-- 로그인 모달 -->
<div class="modal-bg login-modal" id="loginModalBg" onclick="closeLoginByBackground(event)">

  <div class="modal">

    <h2>관리자 로그인</h2>

    <div class="login-message">
      로그인하면 일정을 추가하거나 수정하고 삭제할 수 있습니다.
    </div>

    <div class="form-group">
      <label>이메일</label>
      <input
        type="email"
        id="emailInput"
        placeholder="이메일"
        autocomplete="email"
      >
    </div>

    <div class="form-group">
      <label>비밀번호</label>
      <input
        type="password"
        id="passwordInput"
        placeholder="비밀번호"
        autocomplete="current-password"
      >
    </div>

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeLoginModal()"
      >
        취소
      </button>

      <button
        class="save-btn"
        onclick="login()"
      >
        로그인
      </button>

    </div>

  </div>
</div>

<script>
  /* =========================================================
     Supabase
  ========================================================= */

  const SUPABASE_URL =
    "https://invachujoiisrbhkzhzc.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_1-PfSu1n9AE0PdTKTQExFA_tIsfTJmZ";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     상태
  ========================================================= */

  let currentDate = new Date();

  let events = [];

  let currentUser = null;

  let editingEventId = null;

  /*
    드래그 선택 상태
  */
  let isDragging = false;

  let dragStartDate = null;

  let dragCurrentDate = null;

  let selectedDates = [];

  let suppressNextClick = false;


  /* =========================================================
     DOM
  ========================================================= */

  const monthTitle =
    document.getElementById("monthTitle");

  const calendarGrid =
    document.getElementById("calendarGrid");

  const errorBox =
    document.getElementById("errorBox");

  const loginStatus =
    document.getElementById("loginStatus");

  const loginButton =
    document.getElementById("loginButton");


  /* =========================================================
     공통
  ========================================================= */

  function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";
  }


  function clearError() {

    errorBox.textContent = "";

    errorBox.style.display = "none";
  }


  function formatDate(date) {

    const y = date.getFullYear();

    const m =
      String(date.getMonth() + 1).padStart(2, "0");

    const d =
      String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }


  function parseLocalDate(dateString) {

    const [year, month, day] =
      dateString.split("-").map(Number);

    return new Date(
      year,
      month - 1,
      day
    );
  }


  function getEventsForDate(dateString) {

    return events.filter(
      event => event.date === dateString
    );
  }


  /* =========================================================
     인증
  ========================================================= */

  async function checkAuth() {

    try {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();

      currentUser =
        session?.user || null;

      updateAuthUI();

    } catch (error) {

      console.error(error);

    }
  }


  function updateAuthUI() {

    if (currentUser) {

      loginStatus.textContent =
        "관리자 로그인 상태 · 일정 추가/수정/삭제 가능";

      loginButton.textContent =
        "로그아웃";

      loginButton.onclick =
        logout;

    } else {

      loginStatus.textContent =
        "공개 캘린더 · 누구나 일정 확인 가능";

      loginButton.textContent =
        "관리자 로그인";

      loginButton.onclick =
        openLoginModal;
    }

    renderCalendar();
  }


  function openLoginModal() {

    document
      .getElementById("loginModalBg")
      .classList.add("show");

    setTimeout(() => {

      document
        .getElementById("emailInput")
        .focus();

    }, 100);
  }


  function closeLoginModal() {

    document
      .getElementById("loginModalBg")
      .classList.remove("show");
  }


  async function login() {

    clearError();

    const email =
      document
        .getElementById("emailInput")
        .value
        .trim();

    const password =
      document
        .getElementById("passwordInput")
        .value;

    if (!email || !password) {

      alert("이메일과 비밀번호를 입력해주세요.");

      return;
    }

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        throw error;
      }

      currentUser =
        data.user;

      closeLoginModal();

      document
        .getElementById("passwordInput")
        .value = "";

      updateAuthUI();

    } catch (error) {

      console.error(error);

      alert(
        "로그인에 실패했습니다.\n" +
        error.message
      );
    }
  }


  async function logout() {

    try {

      await supabaseClient.auth.signOut();

      currentUser = null;

      updateAuthUI();

    } catch (error) {

      console.error(error);

      alert("로그아웃 중 오류가 발생했습니다.");
    }
  }


  /* =========================================================
     일정 불러오기
  ========================================================= */

  async function loadEvents() {

    clearError();

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("events")
          .select("*")
          .order("date", {
            ascending: true
          });

      if (error) {
        throw error;
      }

      events = data || [];

      renderCalendar();

    } catch (error) {

      console.error(error);

      showError(
        "일정을 불러오지 못했습니다: " +
        error.message
      );
    }
  }


  /* =========================================================
     캘린더 렌더링
  ========================================================= */

  function renderCalendar() {

    const year =
      currentDate.getFullYear();

    const month =
      currentDate.getMonth();

    monthTitle.textContent =
      `${year}년 ${month + 1}월`;

    calendarGrid.innerHTML = "";

    /*
      JS Date:
      일요일 = 0
      월요일 = 1
      ...
      토요일 = 6

      캘린더:
      월요일 = 0
      ...
      일요일 = 6

      따라서 아래처럼 변환
    */
    const jsFirstDay =
      new Date(
        year,
        month,
        1
      ).getDay();

    const firstDay =
      (jsFirstDay + 6) % 7;

    const daysInMonth =
      new Date(
        year,
        month + 1,
        0
      ).getDate();


    /*
      앞쪽 빈칸
    */
    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty-cell";

      calendarGrid.appendChild(empty);
    }


    /*
      날짜
    */
    const today =
      new Date();

    const todayString =
      formatDate(today);


    for (
      let dayNumber = 1;
      dayNumber <= daysInMonth;
      dayNumber++
    ) {

      const date =
        new Date(
          year,
          month,
          dayNumber
        );

      const dateString =
        formatDate(date);

      const day =
        document.createElement("div");

      day.className =
        "day";

      day.dataset.date =
        dateString;

      if (currentUser) {

        day.classList.add(
          "admin-day"
        );
      }


      /*
        토/일
      */
      const jsDay =
        date.getDay();

      if (jsDay === 6) {
        day.classList.add("saturday");
      }

      if (jsDay === 0) {
        day.classList.add("sunday");
      }


      /*
        오늘
      */
      if (dateString === todayString) {

        day.classList.add("today");
      }


      /*
        날짜 숫자
      */
      const number =
        document.createElement("div");

      number.className =
        "day-number";

      number.textContent =
        dayNumber;

      day.appendChild(number);


      /*
        일정
      */
      const dayEvents =
        getEventsForDate(dateString);


      /*
        색상 있는 일정이 하나라도 있으면
        날짜 칸 전체를 해당 색상으로 채움.

        여러 색상이 있다면 첫 번째 색상 기준.
      */
      const coloredEvent =
        dayEvents.find(
          event =>
            event.color &&
            event.color !== ""
        );


      if (coloredEvent) {

        const color =
          coloredEvent.color;

        if (
          [
            "gray",
            "green",
            "yellow",
            "purple"
          ].includes(color)
        ) {

          day.classList.add(
            `colored-${color}`
          );
        }
      }


      /*
        일정 표시
      */
      const eventsContainer =
        document.createElement("div");

      eventsContainer.className =
        "events";


      dayEvents.forEach(event => {

        const eventElement =
          document.createElement("div");

        eventElement.className =
          "event";


        if (
          !event.color ||
          event.color === ""
        ) {

          eventElement.classList.add(
            "no-color"
          );

        } else {

          eventElement.classList.add(
            `color-${event.color}`
          );
        }


        eventElement.textContent =
          event.title;


        /*
          일정 자체를 누르면
          드래그 시작이 아니라 수정
        */
        eventElement.addEventListener(
          "pointerdown",
          eventObject => {

            eventObject.stopPropagation();

          }
        );


        eventElement.addEventListener(
          "click",
          eventObject => {

            eventObject.stopPropagation();

            if (!currentUser) {
              return;
            }

            openEditModal(event);

          }
        );


        eventsContainer.appendChild(
          eventElement
        );

      });


      day.appendChild(
        eventsContainer
      );


      /*
        날짜 클릭
      */
      day.addEventListener(
        "click",
        () => {

          if (suppressNextClick) {

            suppressNextClick = false;

            return;
          }

          if (!currentUser) {
            return;
          }


          const dayEvents =
            getEventsForDate(
              dateString
            );


          if (dayEvents.length > 0) {

            openEditModal(
              dayEvents[0]
            );

          } else {

            openAddModal(
              dateString
            );
          }
        }
      );


      calendarGrid.appendChild(day);
    }


    /*
      뒤쪽 빈칸
    */
    const totalCells =
      firstDay + daysInMonth;

    const remaining =
      (7 - (totalCells % 7)) % 7;

    for (
      let i = 0;
      i < remaining;
      i++
    ) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty-cell";

      calendarGrid.appendChild(empty);
    }
  }


  /* =========================================================
     월 이동
  ========================================================= */

  function changeMonth(amount) {

    currentDate =
      new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() + amount,
        1
      );

    clearDragSelection();

    renderCalendar();
  }


  function goToday() {

    const today =
      new Date();

    currentDate =
      new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      );

    clearDragSelection();

    renderCalendar();
  }


  /* =========================================================
     날짜 범위 계산
  ========================================================= */

  function getDateRange(
    startString,
    endString
  ) {

    let start =
      parseLocalDate(startString);

    let end =
      parseLocalDate(endString);


    if (start > end) {

      const temp = start;

      start = end;

      end = temp;
    }


    const result = [];

    const cursor =
      new Date(start);


    while (cursor <= end) {

      result.push(
        formatDate(cursor)
      );

      cursor.setDate(
        cursor.getDate() + 1
      );
    }


    return result;
  }


  /* =========================================================
     드래그 선택
  ========================================================= */

  function updateDragSelection() {

    if (
      !dragStartDate ||
      !dragCurrentDate
    ) {
      return;
    }


    selectedDates =
      getDateRange(
        dragStartDate,
        dragCurrentDate
      );


    /*
      현재 보이는 날짜 중
      선택된 날짜에 클래스 적용
    */
    document
      .querySelectorAll(
        ".day[data-date]"
      )
      .forEach(day => {

        const date =
          day.dataset.date;

        day.classList.toggle(
          "drag-selected",
          selectedDates.includes(date)
        );

        day.classList.toggle(
          "drag-anchor",
          date === dragStartDate
        );
      });
  }


  function clearDragSelection() {

    document
      .querySelectorAll(
        ".day.drag-selected, .day.drag-anchor"
      )
      .forEach(day => {

        day.classList.remove(
          "drag-selected",
          "drag-anchor"
        );
      });


    selectedDates = [];

    dragStartDate = null;

    dragCurrentDate = null;
  }


  function startDrag(dateString) {

    if (!currentUser) {
      return;
    }


    isDragging = true;

    dragStartDate =
      dateString;

    dragCurrentDate =
      dateString;

    selectedDates = [
      dateString
    ];


    calendarGrid.classList.add(
      "dragging"
    );


    updateDragSelection();
  }


  function updateDragFromPointer(
    clientX,
    clientY
  ) {

    if (!isDragging) {
      return;
    }


    const element =
      document.elementFromPoint(
        clientX,
        clientY
      );


    if (!element) {
      return;
    }


    const day =
      element.closest(
        ".day[data-date]"
      );


    if (!day) {
      return;
    }


    const dateString =
      day.dataset.date;


    if (
      dateString !==
      dragCurrentDate
    ) {

      dragCurrentDate =
        dateString;

      updateDragSelection();
    }
  }


  function finishDrag() {

    if (!isDragging) {
      return;
    }


    isDragging = false;

    calendarGrid.classList.remove(
      "dragging"
    );


    const dates =
      [...selectedDates];


    /*
      드래그가 끝난 직후
      click 이벤트가 한 번 더 발생하는 것을 방지
    */
    suppressNextClick = true;


    /*
      잠깐 뒤 click 억제 해제
    */
    setTimeout(() => {

      suppressNextClick = false;

    }, 250);


    if (dates.length === 0) {

      clearDragSelection();

      return;
    }


    /*
      날짜가 하나면 일반 일정 추가
    */
    if (dates.length === 1) {

      const date =
        dates[0];

      clearDragSelection();

      openAddModal(date);

      return;
    }


    /*
      여러 날짜면
      여러 날짜 일정 추가 모달
    */
    selectedDates =
      dates;

    openMultiAddModal(dates);
  }


  /*
    날짜에서 pointerdown
  */
  calendarGrid.addEventListener(
    "pointerdown",
    event => {

      if (!currentUser) {
        return;
      }


      /*
        일정 위에서 누르면
        일정 수정용이므로 드래그 시작하지 않음
      */
      if (
        event.target.closest(".event")
      ) {
        return;
      }


      const day =
        event.target.closest(
          ".day[data-date]"
        );


      if (!day) {
        return;
      }


      event.preventDefault();

      startDrag(
        day.dataset.date
      );
    }
  );


  /*
    마우스/포인터 이동
  */
  document.addEventListener(
    "pointermove",
    event => {

      if (!isDragging) {
        return;
      }


      event.preventDefault();

      updateDragFromPointer(
        event.clientX,
        event.clientY
      );
    },
    {
      passive: false
    }
  );


  /*
    마우스 버튼을 놓음
  */
  document.addEventListener(
    "pointerup",
    () => {

      if (isDragging) {

        finishDrag();
      }
    }
  );


  /*
    포인터가 캘린더 밖으로 나가도
    선택 상태가 유지되도록 함.
    버튼을 놓으면 document pointerup에서 처리.
  */


  /* =========================================================
     일정 추가
  ========================================================= */

  function openAddModal(
    dateString
  ) {

    if (!currentUser) {
      return;
    }


    editingEventId = null;

    selectedDates = [
      dateString
    ];


    document
      .getElementById("eventModalTitle")
      .textContent =
      "일정 추가";


    document
      .getElementById("dateInput")
      .value =
      dateString;


    document
      .getElementById("singleDateGroup")
      .style.display =
      "block";


    document
      .getElementById("rangeDateGroup")
      .style.display =
      "none";


    document
      .getElementById("titleInput")
      .value =
      "";


    document
      .getElementById("colorInput")
      .value =
      "";


    document
      .getElementById("deleteButton")
      .style.display =
      "none";


    document
      .getElementById("eventModalBg")
      .classList.add("show");


    setTimeout(() => {

      document
        .getElementById("titleInput")
        .focus();

    }, 100);
  }


  /* =========================================================
     여러 날짜 일정 추가
  ========================================================= */

  function openMultiAddModal(
    dates
  ) {

    if (!currentUser) {
      return;
    }


    editingEventId = null;


    selectedDates =
      [...dates];


    document
      .getElementById("eventModalTitle")
      .textContent =
      "여러 날짜 일정 추가";


    document
      .getElementById("singleDateGroup")
      .style.display =
      "none";


    document
      .getElementById("rangeDateGroup")
      .style.display =
      "block";


    const first =
      dates[0];

    const last =
      dates[dates.length - 1];


    let dateText;


    if (first === last) {

      dateText =
        first;

    } else {

      dateText =
        `${first} ~ ${last}`;
    }


    document
      .getElementById("rangeInfo")
      .innerHTML =
      `<strong>${dateText}</strong><br>` +
      `${dates.length}일에 같은 일정이 등록됩니다.`;


    document
      .getElementById("titleInput")
      .value =
      "";


    /*
      중요:
      드래그해서 여러 날짜를 등록할 때도
      색상을 선택할 수 있음.
    */
    document
      .getElementById("colorInput")
      .value =
      "";


    document
      .getElementById("deleteButton")
      .style.display =
      "none";


    document
      .getElementById("eventModalBg")
      .classList.add("show");


    setTimeout(() => {

      document
        .getElementById("titleInput")
        .focus();

    }, 100);
  }


  /* =========================================================
     일정 수정
  ========================================================= */

  function openEditModal(event) {

    if (!currentUser) {
      return;
    }


    editingEventId =
      event.id;


    selectedDates = [
      event.date
    ];


    document
      .getElementById("eventModalTitle")
      .textContent =
      "일정 수정";


    document
      .getElementById("singleDateGroup")
      .style.display =
      "block";


    document
      .getElementById("rangeDateGroup")
      .style.display =
      "none";


    document
      .getElementById("dateInput")
      .value =
      event.date;


    document
      .getElementById("titleInput")
      .value =
      event.title;


    document
      .getElementById("colorInput")
      .value =
      event.color || "";


    document
      .getElementById("deleteButton")
      .style.display =
      "block";


    document
      .getElementById("eventModalBg")
      .classList.add("show");


    setTimeout(() => {

      document
        .getElementById("titleInput")
        .focus();

    }, 100);
  }


  /* =========================================================
     모달 닫기
  ========================================================= */

  function closeEventModal() {

    document
      .getElementById("eventModalBg")
      .classList.remove("show");


    editingEventId = null;

    selectedDates = [];

    clearDragSelection();
  }


  function closeModalByBackground(
    event
  ) {

    if (
      event.target.id ===
      "eventModalBg"
    ) {

      closeEventModal();
    }
  }


  function closeLoginByBackground(
    event
  ) {

    if (
      event.target.id ===
      "loginModalBg"
    ) {

      closeLoginModal();
    }
  }


  /* =========================================================
     일정 저장
  ========================================================= */

  async function saveEvent() {

    if (!currentUser) {

      alert(
        "일정을 추가하려면 먼저 로그인해주세요."
      );

      return;
    }


    clearError();


    const title =
      document
        .getElementById("titleInput")
        .value
        .trim();


    const color =
      document
        .getElementById("colorInput")
        .value;


    if (!title) {

      alert(
        "일정 내용을 입력해주세요."
      );

      document
        .getElementById("titleInput")
        .focus();

      return;
    }


    /*
      기존 일정 수정
    */
    if (editingEventId) {

      const date =
        document
          .getElementById("dateInput")
          .value;


      if (!date) {

        alert("날짜를 선택해주세요.");

        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("events")
            .update({
              date: date,
              title: title,
              color: color
            })
            .eq(
              "id",
              editingEventId
            )
            .select();


        if (error) {
          throw error;
        }


        /*
          로컬 상태 갱신
        */
        const index =
          events.findIndex(
            event =>
              event.id ===
              editingEventId
          );


        if (index !== -1) {

          events[index] =
            data[0];
        }


        closeEventModal();

        renderCalendar();

        return;

      } catch (error) {

        console.error(error);

        alert(
          "일정 수정에 실패했습니다.\n" +
          error.message
        );

        return;
      }
    }


    /*
      새 일정
    */

    let datesToSave =
      [...selectedDates];


    /*
      단일 날짜 추가
    */
    if (datesToSave.length === 0) {

      const date =
        document
          .getElementById("dateInput")
          .value;


      if (!date) {

        alert("날짜를 선택해주세요.");

        return;
      }


      datesToSave = [
        date
      ];
    }


    /*
      혹시 중복 날짜가 있으면 제거
    */
    datesToSave =
      [...new Set(datesToSave)];


    /*
      핵심:
      여러 날짜에 각각 하나씩 같은 일정 생성.

      선택한 색상도 모든 행에 동일하게 들어감.
    */
    const rows =
      datesToSave.map(date => ({

        id:
          crypto.randomUUID(),

        date:
          date,

        title:
          title,

        color:
          color
      }));


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("events")
          .insert(rows)
          .select();


      if (error) {
        throw error;
      }


      /*
        새로 추가된 일정들을
        로컬 배열에 추가
      */
      if (data) {

        events.push(
          ...data
        );
      }


      closeEventModal();

      renderCalendar();

    } catch (error) {

      console.error(error);

      alert(
        "일정 저장에 실패했습니다.\n" +
        error.message
      );
    }
  }


  /* =========================================================
     일정 삭제
  ========================================================= */

  async function deleteEvent() {

    if (!currentUser) {
      return;
    }


    if (!editingEventId) {
      return;
    }


    const event =
      events.find(
        item =>
          item.id ===
          editingEventId
      );


    if (!event) {
      return;
    }


    const confirmed =
      confirm(
        `"${event.title}" 일정을 삭제할까요?`
      );


    if (!confirmed) {
      return;
    }


    try {

      const {
        error
      } =
        await supabaseClient
          .from("events")
          .delete()
          .eq(
            "id",
            editingEventId
          );


      if (error) {
        throw error;
      }


      events =
        events.filter(
          item =>
            item.id !==
            editingEventId
        );


      closeEventModal();

      renderCalendar();

    } catch (error) {

      console.error(error);

      alert(
        "일정 삭제에 실패했습니다.\n" +
        error.message
      );
    }
  }


  /* =========================================================
     키보드
  ========================================================= */

  document.addEventListener(
    "keydown",
    event => {

      /*
        Enter로 일정 저장
      */
      if (
        event.key === "Enter" &&
        document
          .getElementById("eventModalBg")
          .classList.contains("show")
      ) {

        const active =
          document.activeElement;


        if (
          active.id ===
          "titleInput"
        ) {

          event.preventDefault();

          saveEvent();
        }
      }


      /*
        Enter로 로그인
      */
      if (
        event.key === "Enter" &&
        document
          .getElementById("loginModalBg")
          .classList.contains("show")
      ) {

        const active =
          document.activeElement;


        if (
          active.id === "emailInput" ||
          active.id === "passwordInput"
        ) {

          event.preventDefault();

          login();
        }
      }


      /*
        ESC
      */
      if (event.key === "Escape") {

        if (
          document
            .getElementById("eventModalBg")
            .classList.contains("show")
        ) {

          closeEventModal();
        }


        if (
          document
            .getElementById("loginModalBg")
            .classList.contains("show")
        ) {

          closeLoginModal();
        }
      }
    }
  );


  /* =========================================================
     Supabase 인증 상태 변화
  ========================================================= */

  supabaseClient.auth.onAuthStateChange(
    (_event, session) => {

      currentUser =
        session?.user || null;

      updateAuthUI();
    }
  );


  /* =========================================================
     초기 실행
  ========================================================= */

  async function init() {

    await checkAuth();

    await loadEvents();
  }


  init();

</script>
